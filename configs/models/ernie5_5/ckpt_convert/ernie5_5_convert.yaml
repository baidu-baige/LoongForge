torch_dtype: bfloat16

hydra:
  searchpath:
    - file://${oc.env:LOONGFORGE_PATH}/configs/models/

defaults:
  - ernie5_5@module: ???
  - _self_

args:
  common:
    num_layers: ${module.num_layers}
    hidden_size: ${module.hidden_size}
    ffn_hidden_size: ${module.ffn_hidden_size}
    num_attention_heads: ${module.num_attention_heads}
    num_key_value_heads: ${module.num_query_groups}
    vocab_size: ${module.vocab_size_in_config_file}
    num_experts: ${module.num_experts}
    mtp_num_layers: ${module.mtp_num_layers}
    mtp_shared_last_layer: ${module.mtp_shared_last_layer}
  huggingface:
    mtp_layer_id: ${module.num_layers}
    mqa_latent_rope_adjacent_pairing: true
  mcore:
    add_embedding_padding: false
    make_vocab_size_divisible_by: 1
    untie_embeddings_and_output_weights: true
    transpose_mlp_dense: true

name_map:
  huggingface:
    word_embeddings: model.embed_tokens
    transformer: model
    layer_prefix: layers
    input_layernorm: input_layernorm
    post_attention_layernorm: post_attention_layernorm
    attention.dense: self_attn.o_proj

    # H layers keep the compressed-attention projection names in HF.
    attention.q_down: self_attn.linear_q_down_proj
    attention.q_up: self_attn.linear_q_up_proj
    attention.q_up_layernorm: self_attn.q_layernorm
    attention.kv_norm: self_attn.kv_layernorm
    ernie55.h_attention.kv: self_attn.linear_kv_proj
    attention.wo_a:
      name: self_attn.linear_o_group_proj
      is_direct_name: true
    attention.attn_sink:
      name: self_attn.core_attention.attn_sink
      is_direct_name: true
    attention.compressor.wkv: self_attn.core_attention.compressor.linear_wkv
    attention.compressor.wgate: self_attn.core_attention.compressor.linear_wgate
    attention.compressor.ape:
      name: self_attn.core_attention.compressor.ape
      is_direct_name: true
    attention.compressor.norm: self_attn.core_attention.compressor.norm
    ernie55.h_attention.gate:
      name: self_attn.gate_proj
      depend_on_key: ernie55.h_attention.kv

    # D-layer kv_b_proj is split into K/V by the HF tensor transform.
    ernie55.d_attention.q_down: self_attn.q_a_proj
    ernie55.d_attention.q_up: self_attn.q_b_proj
    ernie55.d_attention.q_norm: self_attn.q_a_layernorm
    attention.kv_down: self_attn.kv_a_proj_with_mqa
    attention.kv_up_layernorm: self_attn.kv_a_layernorm
    ernie55.d_attention.k_up:
      name: self_attn.k_b_proj
      is_direct_name: true
    ernie55.d_attention.v_up:
      name: self_attn.v_b_proj
      is_direct_name: true
    ernie55.d_attention.sink:
      name: self_attn.core_attention.softmax_offset
      is_direct_name: true
    ernie55.d_attention.gate:
      name: self_attn.gate_proj
      depend_on_key: attention.kv_down
    attention.indexer.k_norm: self_attn.core_attention.indexer.k_norm
    attention.indexer.weights_proj: self_attn.core_attention.indexer.weights_proj
    attention.indexer.wk: self_attn.core_attention.indexer.wk
    attention.indexer.wq_b: self_attn.core_attention.indexer.wq_b
    ernie55.vha_u:
      name: self_attn.vha_postmix_U
      is_direct_name: true
    ernie55.vha_v:
      name: self_attn.vha_postmix_V
      is_direct_name: true

    mlp.dense_h_to_4h:
      - mlp.gate_proj
      - mlp.up_proj
    mlp.dense_4h_to_h: mlp.down_proj
    moe.gate: block_sparse_moe.gate
    moe.gate.bias: block_sparse_moe.e_score_correction_bias
    ernie55.router.weight_1:
      name: block_sparse_moe.gate.weight_1
      is_direct_name: true
    ernie55.router.scale:
      name: block_sparse_moe.gate.routed_scaling_factor_param
      is_direct_name: true
    ernie55.latent_down: block_sparse_moe.fc1_latent_proj
    ernie55.latent_up: block_sparse_moe.fc2_latent_proj
    ernie55.latent_norm: block_sparse_moe.latent_norm
    moe.expert: block_sparse_moe.experts
    moe.shared_expert: block_sparse_moe.shared_experts
    moe.expert_h_to_4h: [w1, w3]
    moe.expert_4h_to_h: w2
    moe.shared_expert_h_to_4h: [w1, w3]
    moe.shared_expert_4h_to_h: w2

    hc_attn_fn:
      name: self_attention_hyper_connection.mapping_proj.weight
      is_direct_name: true
      need_transpose: true
    hc_attn_base:
      name: self_attention_hyper_connection.bias
      is_direct_name: true
    hc_attn_alpha_pre:
      name: self_attention_hyper_connection.alpha_pre
      is_direct_name: true
    hc_attn_alpha_post:
      name: self_attention_hyper_connection.alpha_post
      is_direct_name: true
    hc_attn_alpha_res:
      name: self_attention_hyper_connection.alpha_res
      is_direct_name: true
    hc_ffn_fn:
      name: mlp_hyper_connection.mapping_proj.weight
      is_direct_name: true
      need_transpose: true
    hc_ffn_base:
      name: mlp_hyper_connection.bias
      is_direct_name: true
    hc_ffn_alpha_pre:
      name: mlp_hyper_connection.alpha_pre
      is_direct_name: true
    hc_ffn_alpha_post:
      name: mlp_hyper_connection.alpha_post
      is_direct_name: true
    hc_ffn_alpha_res:
      name: mlp_hyper_connection.alpha_res
      is_direct_name: true
    final_layernorm: model.norm
    word_embeddings_for_head: lm_head
    hc_head_fn:
      name: model.mhc_contract.hc_head_fn
      is_direct_name: true
      need_transpose: true
    hc_head_base:
      name: model.mhc_contract.hc_head_base
      is_direct_name: true
    hc_head_scale:
      name: model.mhc_contract.hc_head_scale
      is_direct_name: true
    ernie55.multimax_ranges:
      name: model.lm_head.multimax_ranges
      is_direct_name: true
    ernie55.multimax_ts:
      name: model.lm_head.multimax_ts
      is_direct_name: true

    # The MTP transformer body shares the final decoder's parameters.
    mtp_transformer: model
    mtp_layer_prefix: layers
    mtp_enorm: enorm
    mtp_hnorm: hnorm
    mtp_e_proj: e_proj
    mtp_h_proj: h_proj
    mtp_norm: shared_head.norm
    mtp_hc_head_fn:
      name: hc_head_fn
      is_direct_name: true
      need_transpose: true
    mtp_hc_head_base:
      name: hc_head_base
      is_direct_name: true
    mtp_hc_head_scale:
      name: hc_head_scale
      is_direct_name: true
    ernie55.mtp_router_bias:
      name: block_sparse_moe.e_score_correction_bias
      is_direct_name: true
  mcore:
    word_embeddings: embedding.word_embeddings
    transformer: model
    transformer_tpl: model%d
    layer_prefix: decoder.layers
    input_layernorm: input_layernorm
    post_attention_layernorm: pre_mlp_layernorm
    attention.dense:
      name: self_attention.linear_proj
      extra: true
    attention.q_down:
      name: self_attention.linear_q_down_proj
      extra: true
      depend_on_key: ernie55.h_attention.kv
    attention.q_up:
      name: self_attention.linear_q_up_proj
      extra: true
      depend_on_key: ernie55.h_attention.kv
    attention.q_up_layernorm:
      name: self_attention.q_layernorm
      depend_on_key: ernie55.h_attention.kv
    attention.kv_norm:
      name: self_attention.kv_layernorm
      depend_on_key: ernie55.h_attention.kv
    ernie55.h_attention.kv:
      name: self_attention.linear_kv_proj
      extra: true
    attention.wo_a:
      name: self_attention.linear_o_group_proj
      is_direct_name: true
    attention.attn_sink:
      name: self_attention.core_attention.attn_sink
      is_direct_name: true
      depend_on_key: ernie55.h_attention.kv
    attention.compressor.wkv:
      name: self_attention.core_attention.compressor.linear_wkv
      extra: true
    attention.compressor.wgate:
      name: self_attention.core_attention.compressor.linear_wgate
      extra: true
    attention.compressor.ape:
      name: self_attention.core_attention.compressor.ape
      is_direct_name: true
    attention.compressor.norm: self_attention.core_attention.compressor.norm
    ernie55.h_attention.gate:
      name: self_attention.linear_output_gate
      extra: true

    ernie55.d_attention.q_down:
      name: self_attention.linear_q_down_proj
      extra: true
      depend_on_key: attention.kv_down
    ernie55.d_attention.q_up:
      name: self_attention.linear_q_up_proj
      extra: true
      depend_on_key: attention.kv_down
    ernie55.d_attention.q_norm:
      name: self_attention.q_layernorm
      depend_on_key: attention.kv_down
    attention.kv_down:
      name: self_attention.linear_kv_down_proj
      extra: true
    attention.kv_up_layernorm:
      name: self_attention.kv_layernorm
      depend_on_key: attention.kv_down
    ernie55.d_attention.k_up:
      name: self_attention.k_b_proj
      is_direct_name: true
    ernie55.d_attention.v_up:
      name: self_attention.v_b_proj
      is_direct_name: true
    ernie55.d_attention.sink:
      name: self_attention.core_attention.attn_sink
      is_direct_name: true
      depend_on_key: attention.kv_down
    ernie55.d_attention.gate:
      name: self_attention.core_attention.linear_output_gate
      extra: true
    attention.indexer.k_norm: self_attention.core_attention.indexer.k_norm
    attention.indexer.weights_proj:
      name: self_attention.core_attention.indexer.linear_weights_proj
      extra: true
    attention.indexer.wk:
      name: self_attention.core_attention.indexer.linear_wk
      extra: true
    attention.indexer.wq_b:
      name: self_attention.core_attention.indexer.linear_wq_b
      extra: true
    ernie55.vha_u:
      name: self_attention.core_attention.vha_postmix_u
      is_direct_name: true
    ernie55.vha_v:
      name: self_attention.core_attention.vha_postmix_v
      is_direct_name: true

    mlp.dense_h_to_4h:
      name: mlp.linear_fc1
      extra: true
    mlp.dense_4h_to_h:
      name: mlp.linear_fc2
      extra: true
    moe.gate: mlp.router
    moe.gate.bias: mlp.router.expert_bias
    ernie55.router.weight_1:
      name: mlp.router.weight_1
      is_direct_name: true
    ernie55.router.scale:
      name: mlp.router.routed_scaling_factor_param
      is_direct_name: true
    ernie55.latent_down: mlp.fc1_latent_proj
    ernie55.latent_up: mlp.fc2_latent_proj
    ernie55.latent_norm: mlp.fc2_norm
    moe.expert: mlp.experts.local_experts
    moe.groupedgemm.expert: mlp.experts
    moe.shared_expert: mlp.shared_experts
    moe.expert_h_to_4h:
      name: linear_fc1
      extra: true
    moe.expert_4h_to_h:
      name: linear_fc2
      extra: true

    hc_attn_fn: self_attention_hyper_connection.mapping_proj
    hc_attn_base:
      name: self_attention_hyper_connection.bias
      is_direct_name: true
    hc_attn_alpha_pre:
      name: self_attention_hyper_connection.alpha_pre
      is_direct_name: true
    hc_attn_alpha_post:
      name: self_attention_hyper_connection.alpha_post
      is_direct_name: true
    hc_attn_alpha_res:
      name: self_attention_hyper_connection.alpha_res
      is_direct_name: true
    hc_ffn_fn: mlp_hyper_connection.mapping_proj
    hc_ffn_base:
      name: mlp_hyper_connection.bias
      is_direct_name: true
    hc_ffn_alpha_pre:
      name: mlp_hyper_connection.alpha_pre
      is_direct_name: true
    hc_ffn_alpha_post:
      name: mlp_hyper_connection.alpha_post
      is_direct_name: true
    hc_ffn_alpha_res:
      name: mlp_hyper_connection.alpha_res
      is_direct_name: true
    final_layernorm: decoder.final_layernorm
    word_embeddings_for_head: output_layer
    hc_head_fn:
      name: decoder.head_hyper_connection.hc_head_fn
      is_direct_name: true
    hc_head_base:
      name: decoder.head_hyper_connection.hc_head_base
      is_direct_name: true
    hc_head_scale:
      name: decoder.head_hyper_connection.hc_head_scale
      is_direct_name: true
    ernie55.multimax_ranges:
      name: output_layer.multimax_ranges
      is_direct_name: true
    ernie55.multimax_ts:
      name: output_layer.multimax_ts
      is_direct_name: true
    mtp_layer_prefix: mtp.layers
    mtp_name_prefix_for_layer: transformer_layer
    mtp_word_embeddings: embedding.word_embeddings
    mtp_enorm: enorm
    mtp_hnorm: hnorm
    mtp_e_proj:
      name: e_proj
      extra: true
    mtp_h_proj:
      name: h_proj
      extra: true
    mtp_norm: final_layernorm
    mtp_hc_head_fn:
      name: hc_head_fn
      is_direct_name: true
    mtp_hc_head_base:
      name: hc_head_base
      is_direct_name: true
    mtp_hc_head_scale:
      name: hc_head_scale
      is_direct_name: true
    ernie55.mtp_router_bias:
      name: transformer_layer.mlp.router.expert_bias
      is_direct_name: true
