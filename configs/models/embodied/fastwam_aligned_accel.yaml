# fastwam_aligned_accel.yaml
# = the branch's fastwam.yaml plus PR240 training-side alignment (FastWAM min/max
#   normalization + LR parity + action shift 1.0). Two changes only:
#     model.mot_compile_blocks : both -> none   (measured: "both" is ~1% slower, a net
#                                                 loss, so it is intentionally left off)
#     data.norm_stats_path     : null -> <eval dataset_stats.json>
#                                 (activates PR240's FastWAM-style normalization;
#                                  normalization_mode is then ignored)
# Everything else keeps the branch defaults: accel is on by default
# (disable_train_autocast / drop_all_true_cross_attn_mask / compile_vae_encode),
# image=siglip/center_crop, normalization_mode=q99.
#
# This is the exact config used by the two PR240 20k runs
# (lf_sft_pr240_accel_20k / lf_sft_pr240_fp32master_20k).
#
# One-shot reproduction of "training-side alignment + acceleration":
#   bash examples/embodied/fastwam/run_fastwam_sft_ddp_zero1_finetune.sh \
#       --config-file configs/models/embodied/fastwam_aligned_accel.yaml \
#       --optimizer TorchFusedAdamW \
#       --lr-base 1e-4 --lr-warmup-iters 1000 --min-lr 1e-6 \
#       --lr-decay-style linear_warmup_cosine_annealing \
#       --save-format dcp --async-save
#   (for the fp32-master variant, add --zero-master-param-dtype fp32)
model:
  model_type: fastwam
  variant: uncond
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
  action_dim: 7
  action_horizon: 32
  proprio_dim: 8
  max_action_dim: null
  tokenizer_max_len: 128
  load_text_encoder: false
  mot_checkpoint_mixed_attn: false
  skip_dit_load_from_pretrain: false
  action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
  redirect_common_files: true
  dtype: bfloat16
  rmsnorm_impl: wan
  disable_train_autocast: true
  drop_all_true_cross_attn_mask: true
  compile_vae_encode: true
  mot_compile_blocks: none
  action_scheduler:
    train_shift: 1.0
    infer_shift: 1.0
    num_train_timesteps: 1000
data:
  num_video_frames: 9
  image_size: 224
  image_normalize_mode: siglip
  image_resize_strategy: center_crop
  text_embedding_cache_dir: data/text_embeds_cache/libero
  use_image_transform: true
  normalization_mode: q99
  # FastWAM-style action/proprio normalization (PR240): same stats file eval uses.
  norm_stats_path: /path/to/dataset_stats.json
  fastwam_norm_mode: min/max
  delta_action_dim_mask: [true, true, true, true, true, true, false]
  action_padding_strategy: zero
  action_video_freq_ratio: 4
