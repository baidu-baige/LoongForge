# ─────────────────────────────────────────────────────────────────────────────
# model: — everything under this block maps 1:1 to GigaBrainModelConfig(**model),
# which GigaBrainPolicy.from_pretrained/__init__ passes straight through to
# GigaBrain0Policy(**kwargs). Values below mirror the reference
# GigaBrain-0.1-3.5B-Base/config.json, EXCEPT enable_knowledge_insulation:
# the reference finetune configs (configs/giga_brain_0_agibot_a2d_finetune*.py
# `models=dict(..., enable_knowledge_insulation=False, ...)`) override the
# checkpoint's `True` to `False` at finetune time via GigaBrain0Trainer's
# `process_model` rebuild path — this YAML reproduces that override directly
# instead of re-implementing the rebuild-and-copy-weights dance.
# ─────────────────────────────────────────────────────────────────────────────
model:
  model_type: giga_brain0

  max_state_dim: 32
  max_action_dim: 32
  proj_width: 1024
  vlm_type: paligemma2
  vlm_hidden_size: 2304
  n_action_steps: 50
  num_steps: 10
  use_cache: true
  vision_in_channels: 3
  enable_knowledge_insulation: false
  enable_next_token_prediction: true
  enable_learnable_traj_token: false
  num_traj_tokens: 10
  max_traj_dim: 4
  traj_hidden_dim: 256
  num_embodiments: 3

  # AgiBot-World Alpha (A2D) dual-arm robot -> maps to the AgiBot-G1 embodiment
  # (id=1) in giga_brain_0_transforms.py::robot_type_mapping.
  robot_type: a2d

  # ── 统一开关：粗粒度 NVTX 性能剖析标签 ──────────────────────────────
  # true 时，为生成"2.1 阶段级汇总"算子级拆解所用的 6 个代码区域打 NVTX 标签
  # (vision_tower / paligemma_expert / action_head / diffusion_loss /
  #  backward / optimizer_step)，供 nsys 采集。默认 false = 完全 no-op、零开销、
  # 不改训练行为。环境变量 LOONGFORGE_NVTX=1 可强制开启（覆盖此项）。
  enable_nvtx_profiling: false

  # 融合 RMSNorm 优化开关：true = 用 torch.nn.functional.rms_norm 融合 kernel
  # (单个 aten::_fused_rms_norm，实测吐吞 +~7%、loss 等价)；false = 回退原手写
  # pow/mean/mul 链。默认 true。
  enable_fused_rms_norm: true

  # 融合 RoPE 优化开关：true = apply_rotary_pos_emb 用单个 torch.cat 输出两个
  # 旋转半块（消掉 empty_like + 两次索引 copy_ 散写，归因命中 ~124ms 碎片 copy_）；
  # false = 回退原 empty_like + res[...]=... 写法。数值完全等价。默认 true。
  enable_fused_rope: true

# ─────────────────────────────────────────────────────────────────────────────
# data: — everything under this block maps 1:1 to GigaBrainDataConfig(**data).
# Machine-specific paths (data_path / norm_stats_path / tokenizer paths) live in
# the launch script run_giga_brain0_ddp_finetune.sh, not here, so it stays the
# single source of truth. data_path is supplied via --dataset-path (DATA_PATH env
# var), which takes precedence over data.data_path (see giga_brain0_dataset.py).
# ─────────────────────────────────────────────────────────────────────────────
data:
  # data_path supplied by run_giga_brain0_ddp_finetune.sh via --dataset-path
  # (training_args.dataset_path takes precedence over this field).
  data_path: agibot-world/AgiBotWorldLerobot_v30_direct/agibotworld/task_327

  delta_action_cfg:
    use_delta_joint_actions: true
    # '1' == AgiBot G1 embodiment id, which A2D (robot_type='a2d') maps to.
    # 20-dim mask matching observation.state; action's trailing (velocity)
    # dims beyond the mask length default to absolute (see DeltaActions).
    mask:
      "1":
        - true
        - true
        - true
        - true
        - true
        - true
        - true
        - false
        - true
        - true
        - true
        - true
        - true
        - true
        - true
        - false
        - true
        - true
        - true
        - true

  norm_cfg:
    norm_stats_path: {}
    use_quantiles: true
    enable_clamp: false

  image_cfg:
    resize_imgs_with_padding: [224, 224]
    enable_image_aug: true
    present_img_keys:
      - observation.images.top_head
      - observation.images.hand_left
      - observation.images.hand_right
    enable_depth_img: false

  prompt_cfg:
    tokenizer_model_path: paligemma-3b-pt-224
    fast_tokenizer_path: physical-intelligence/fast
    max_length: 200
    discrete_state_input: true
    encode_action_input: false
    encode_sub_task_input: false
    sample_ratios:
      task_only: 1.0
      task_with_subtask: 0
      task_only_using_subtask_regression: 0
      task_only_using_fast_regression: 0
      task_with_subtask_using_fast_regression: 0
