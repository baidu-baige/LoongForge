# VPP2 Wan2.1-I2V-14B + ActionDiT MoT (LIBERO action stage).
model:
  model_type: vpp2
  training_stage: action
  model_id: ${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2/vpp2_assets}/Wan2.1-I2V-14B-480P
  video_checkpoint_path: ${oc.env:VPP2_VIDEO_CHECKPOINT,${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2/vpp2_assets}/libero_video_step010000.pt}
  action_dit_pretrained_path: ${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2/vpp2_assets}/libero/action_init.pt
  # Eager construction strictly loads all weights before distributed wrapping.
  init_on_meta: false
  load_text_encoder: false
  load_clip_encoder: true
  action_dim: 7
  action_horizon: 32
  proprio_dim: 8
  action_chunk_size: 1
  action_visible_video_frames: 3
  action_only_first_frame_fast_path: true
  mot_checkpoint_mixed_attn: true

data:
  num_frames: 65
  action_video_freq_ratio: 4
  image_size: 224
  context_len: 128
  text_embedding_cache_dir: ${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2/vpp2_assets}/text_cache_real
  text_embedding_cache_tag: wan21i2v14b480p
  norm_stats_path: ${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2/vpp2_assets}/libero/dataset_stats.json
