# VPP2 — dual-stream (video + action) world model on the five-layer ``arch`` spec.
#
# Launch:
#   torchrun ... loongforge/train.py --model-name vpp2 --training-phase sft \
#       --pretrained-checkpoint <vpp2 .pt>
#
# No line below says "this is VPP2": model identity has a single source, the
# ``--model-name vpp2`` launch argument. It selects this file plus ``Vpp2Config``
# through ``train/config_map.py``, and ``Vpp2Config.model_type`` is what picks
# the provider. Topology (stream count, visibility, condition table, loss terms)
# is Python code in ``model/arch/spec/providers/dual_stream_wan.py`` and is not
# reachable from here — this file only moves numbers.
#
# Trainable DiT weights are NOT named here either; they arrive via
# ``--pretrained-checkpoint``, which the launcher already owns
# (``train/training_args.py``). ``model_id`` below is the *encoder* stack only
# (Wan VAE + CLIP image encoder), which the shell builds eagerly.

model:
  # Wan2.1 generation: 16 latent channels, /8 spatial stride. The geometry
  # section states the same two facts; the shell cross-checks them so a mismatch
  # fails at build time instead of as a latent-grid shape error.
  model_id: Wan-AI/Wan2.1-I2V-14B-480P
  dtype: bfloat16

  # Token count of the cached text embeddings = length of the ``text``
  # cross-attention slot. Must match the cache under
  # ``data.text_embedding_cache_dir``.
  tokenizer_max_len: 128

  geometry:
    # ``num_frames`` is the number of *pixel* frames the VAE sees, so it must
    # equal ``data.num_video_frames`` — the dataset samples that many frames out
    # of ``(T-1) * action_video_freq_ratio + 1`` raw ones. Latent frames are
    # then ``1 + (num_frames - 1) / 4 = 3``.
    frame_height: 224
    frame_width: 224
    num_frames: 9
    num_views: 2            # two cameras, concatenated along width
    action_horizon: 32
    action_video_freq_ratio: 4
    action_dim: 7           # LIBERO: 6-DoF eef delta + gripper

  streams:
    video:  {residual_width: 5120, num_heads: 40, head_dim: 128, num_layers: 40, ffn_width: 13824}
    action: {residual_width: 512,  num_heads: 40, head_dim: 128, num_layers: 40, ffn_width: 2048}

  # Formal parameter of the ``noise_gated_history`` visibility rule: how many
  # leading video frames the action stream may attend to. There is no
  # ``visibility:`` section — the rule itself is code, only its argument is a
  # knob.
  visible_video_frames: 3

  # Only ``action`` appears. The video stream is not disabled; its timestep
  # distribution has no tunable scalar (the provider pins it to
  # ``Constant(1.0)``, i.e. pure noise), and a section key with nothing to set
  # would be inert.
  diffusion:
    action: {shift: 5.0}

  heads: {video_flow: {weight: 1.0}, action_flow: {weight: 1.0}}

  inference_steps: 10
  proprio_dim: 8

data:
  # Must equal model.geometry.num_frames (see the comment there).
  num_video_frames: 9
  image_size: 224
  image_normalize_mode: siglip
  image_resize_strategy: center_crop
  # Pre-computed text embeddings. The collator hashes each prompt and expects
  # ``<sha256>.t5_len128.<encoder_id>.pt``, so this must be the cache built with
  # tokenizer_max_len=128.
  text_embedding_cache_dir: data/text_embeds_cache/libero
  use_image_transform: true
  normalization_mode: q99
  norm_stats_path: null
  fastwam_norm_mode: min/max
  delta_action_dim_mask: [true, true, true, true, true, true, false]
  action_padding_strategy: zero
  action_video_freq_ratio: 4
