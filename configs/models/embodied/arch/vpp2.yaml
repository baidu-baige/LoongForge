# VPP2 — dual-stream (video + action) world model on the five-layer ``arch`` spec.
#
# Launch:
#   torchrun ... loongforge/embodied/train.py --model-name vpp2
#
# No line below says "this is VPP2": model identity has a single source, the
# ``--model-name vpp2`` launch argument. It selects this file plus ``Vpp2Config``
# through ``train/config_map.py``, and ``Vpp2Config.model_type`` is what picks
# the provider. Topology (stream count, visibility, condition table, loss terms)
# is Python code in ``model/arch/spec/providers/vpp2/spec.py`` and is not
# reachable from here — this file only moves numbers.
#
# Split initializers are runtime paths, not architecture declarations.
# ``model_id`` is the encoder stack; full upstream MoT checkpoints can still
# be loaded through ``--pretrained-checkpoint`` instead of split initialization.

model:
  # Wan2.1 generation: 16 latent channels, /8 spatial stride. The geometry
  # section states the same two facts; the shell cross-checks them so a mismatch
  # fails at build time instead of as a latent-grid shape error.
  model_id: ${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2}/Wan2.1-I2V-14B-480P
  dtype: bfloat16
  training_stage: action
  video_checkpoint_path: ${oc.env:VPP2_VIDEO_CHECKPOINT,${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2}/libero/video_step010000.pt}
  action_dit_pretrained_path: ${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2}/libero/action_init.pt
  gradient_checkpointing: true
  action_only_first_frame_fast_path: true
  video_attention_mask_mode: bidirectional

  # Token count of the cached text embeddings = length of the ``text``
  # cross-attention slot. Must match the cache under
  # ``data.text_embedding_cache_dir``.
  tokenizer_max_len: 128

  geometry:
    # ``num_frames`` is the number of *pixel* frames the VAE sees, so it must
    # equal 1 + (data.num_frames - 1) / action_video_freq_ratio: the VPP2
    # dataset samples 17 RGB frames from a 65-frame window. VAE yields 5 latents.
    frame_height: 224
    frame_width: 224
    num_frames: 17
    num_views: 2            # two cameras, concatenated along width
    action_horizon: 32
    action_video_freq_ratio: 4
    action_dim: 7           # LIBERO: 6-DoF eef delta + gripper

  streams:
    video:  {residual_width: 5120, num_heads: 40, head_dim: 128, num_layers: 40, ffn_width: 13824}
    action: {residual_width: 512,  num_heads: 40, head_dim: 128, num_layers: 40, ffn_width: 2048}

  # Number of source-relative leading video frames read by action through the
  # declarative ``prefix_frames`` policy. This is a fixed prefix, not a sliding
  # history window or an implicit noise gate. The provider owns the topology.
  video_prefix_frames: 3

  # Only ``action`` appears. The video stream is not disabled; its timestep
  # distribution has no tunable scalar (the provider pins it to
  # ``Constant(1.0)``, i.e. pure noise), and a section key with nothing to set
  # would be inert.
  diffusion:
    action: {shift: 5.0}

  heads: {video_flow: {weight: 0.0}, action_flow: {weight: 1.0}}

  inference_steps: 10
  proprio_dim: 8

data:
  # Raw observation span: offsets 0, 4, ..., 64 yield 17 RGB frames.
  # The model owner must keep model.geometry.num_frames aligned at 17.
  num_frames: 65
  action_video_freq_ratio: 4
  image_size: 224
  context_len: 128
  text_embedding_cache_dir: ${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2}/text_cache_real
  text_embedding_cache_tag: wan21i2v14b480p
  norm_stats_path: ${oc.env:VPP2_ASSETS_ROOT,/workspace/vpp2}/libero/dataset_stats.json
  delta_action_dim_mask: [true, true, true, true, true, true, false]
