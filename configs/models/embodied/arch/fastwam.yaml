# FastWAM arch training; legacy --model-name fastwam remains available.
# Use --model-name fastwam_arch --dataset-strategy fastwam.
model:
  model_id: ${oc.env:FASTWAM_ASSETS_ROOT,/workspace/fastwam}/Wan2.2-TI2V-5B
  video_checkpoint_path: ${oc.env:FASTWAM_VIDEO_CHECKPOINT,/workspace/fastwam/video.pt}
  action_dit_pretrained_path: ${oc.env:FASTWAM_ACTION_CHECKPOINT,/workspace/fastwam/action.pt}
  dtype: bfloat16
  tokenizer_max_len: 128
  disable_train_autocast: true
  compile_vae_encode: false
  gradient_checkpointing: false
  video_attention_mask_mode: first_frame_causal
  proprio_dim: 8
  geometry:
    frame_height: 224
    frame_width: 224
    num_frames: 9
    num_views: 2
    latent_channels: 48
    vae_spatial_stride: 16
    action_horizon: 32
    action_video_freq_ratio: 4
    action_dim: 7
  diffusion:
    video: {shift: 5.0}
    action: {shift: 1.0}
  heads:
    video_flow: {weight: 1.0}
    action_flow: {weight: 1.0}
data:
  num_video_frames: 9
  image_size: 224
  image_normalize_mode: siglip
  image_resize_strategy: center_crop
  text_embedding_cache_dir: ${oc.env:FASTWAM_TEXT_CACHE,/workspace/fastwam/text_cache}
  use_image_transform: true
  normalization_mode: q99
  norm_stats_path: null
  fastwam_norm_mode: min/max
  delta_action_dim_mask: [true, true, true, true, true, true, false]
  action_padding_strategy: zero
  action_video_freq_ratio: 4
