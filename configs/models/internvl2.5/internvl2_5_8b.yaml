# hydra:
#   searchpath:
#     - file://configs/

defaults:
  - ../../models/image_encoder@model.image_encoder: intern_vit_0.3b
  - ../../models/image_projector@model.image_projector: intern_mlp_adapter
  - ../../models/internlm2.5@model.foundation: internlm2_5_8b
  - _self_

model:
  model_type: intern_vl
  
  image_projector:
    hidden_size: 4096
    ffn_hidden_size: 4096
  foundation: 
    rotary_emb_func: "DynamicRotaryEmbedding"
    # HF llm_config.rope_scaling = {"type": "dynamic", "factor": 2.0}; applies above max_position_embeddings.
    rope_scaling_factor: 2.0
    rotary_base: 1000000
    model_spec: ["loongforge.models.foundation.internlm.internlm_layer_spec", "get_internlm_layer_with_te_spec"]