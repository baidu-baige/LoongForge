# LoongForge-VLDA LIBERO baseline. Stage 2 is a separate run initialized from Stage 1.
model:
  model_type: vlda
  stage: 1
  action_dim: 7
  state_dim: 8
  action_horizon: 10
  max_action_dim: 32
  max_state_dim: 32
  discrete_state_input: true
  delta_token_num: 16
  delta_latent_dim: 256
  contrast_dim: 256
  gradient_checkpointing: true
  disable_train_autocast: true
  attention_backend: flex
  compile_model: true
  compile_mode: max-autotune-no-cudagraphs

data:
  camera_keys: [image, wrist_image, ""]
  state_key: state
  action_key: actions
  normalization_mode: q99
