_target_: loongforge.models.foundation.glm5_next.Glm5NextConfig

# Full GLM-5.3-Flash architecture (zai-org/GLM-5.3-Flash).
vocab_size: 154880
hidden_size: 4096
intermediate_size: 12288
# num_layers / ffn_hidden_size are consumed by tools/convert_checkpoint via
# OmegaConf interpolation (${module.num_layers} / ${module.ffn_hidden_size})
# before Glm5NextConfig maps them; they must exist as literal keys here.
num_layers: 45
ffn_hidden_size: 12288
moe_intermediate_size: 2048
num_hidden_layers: 45
num_attention_heads: 64
num_key_value_heads: 64
attention_dropout: 0.0
n_shared_experts: 1
n_routed_experts: 288
num_experts_per_tok: 8
routed_scaling_factor: 2.5
n_group: 1
topk_group: 1
norm_topk_prob: true

# Multi-head latent attention and DSA indexer.
q_lora_rank: 1536
kv_lora_rank: 512
qk_rope_head_dim: 0
qk_nope_head_dim: 256
v_head_dim: 256
index_head_dim: 128
index_n_heads: 32
index_topk: 2048
index_kpool: 4                 # released checkpoint: ape [4, 128], config index_kpool=4
index_kpool_always_select_tail: true
experimental_attention_variant: dsa
dsa_indexer_topk_freq: 1
dsa_indexer_skip_topk_offset: 0
dsa_indexer_rotate_activation: false
dsa_indexer_k_norm_epsilon: 1.0e-6
multi_latent_attention: true

# Kimi Delta Attention layers.
linear_head_dim: 128
linear_num_heads: 64
linear_conv_kernel_dim: 4
linear_lower_bound: -5.0

# Four-stream manifold hyper-connections.
hc_mult: 4
hc_eps: 1.0e-6
hc_sinkhorn_iters: 20
enable_hyper_connections: true

rms_norm_eps: 1.0e-5
initializer_range: 0.02
init_method_std: 0.02
swiglu_limit: 10.0
max_position_embeddings: 1048576
pad_token_id: 154820
position_embedding_type: none
add_position_embedding: false
normalization: RMSNorm
add_bias_linear: false
add_qkv_bias: false
gated_linear_unit: true
untie_embeddings_and_output_weights: true

# GLM-5.3-Flash multimodal token ids.
image_token_id: 154854
video_token_id: 154855
image_start_token_id: 154830
image_end_token_id: 154831
video_start_token_id: 154832
video_end_token_id: 154833

# The adapter derives the repeating KDA/KPool-DSA and dense/MoE schedules when omitted.
# The first three MLP blocks are dense; the remaining blocks are routed MoE.
mtp_num_layers: 1
mtp_loss_scaling_factor: 0.1
model_type: glm5_next
convert_file: ${oc.env:LOONGFORGE_PATH}/configs/models/glm5_next/ckpt_convert/glm5.3_flash_convert.yaml

# Vision encoder and projector configuration.
vision_config:
  depth: 24
  hidden_size: 1024
  hidden_act: silu
  attention_bias: true
  attention_dropout: 0.0
  num_heads: 16
  in_channels: 3
  image_size: 448              # released checkpoint config
  patch_size: 14
  rms_norm_eps: 1.0e-5
  spatial_merge_size: 2
  temporal_patch_size: 2
  out_hidden_size: 4096        # released checkpoint: merger.proj [4096, 4096]
  intermediate_size: 4096
  initializer_range: 0.02
  projection_intermediate_size: 10240
  swiglu_limit: 10.0
  model_type: glm5_next_vision
