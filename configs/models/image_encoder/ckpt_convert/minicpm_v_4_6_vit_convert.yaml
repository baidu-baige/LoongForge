hydra:
  searchpath:
    - file://${oc.env:LOONGFORGE_PATH}/configs/models/

defaults:
  - image_encoder@module: ???
  - _self_

args:
  common:
    num_layers: ${module.num_layers}
    hidden_size: ${module.hidden_size}
    ffn_hidden_size: ${module.ffn_hidden_size}
    num_attention_heads: ${module.num_attention_heads}
    num_key_value_heads: ${module.num_query_groups}
  huggingface:
    depth: ${module.num_layers}
    hidden_size: ${module.hidden_size}
    intermediate_size: ${module.ffn_hidden_size}
    num_heads: ${module.num_attention_heads}
    patch_size: ${module.patch_size}
  mcore:
    use_rotary_position_embeddings: false
    use_distributed_optimizer: false
    transpose_mlp_dense: false
    # HF stores q/k/v as three projections; MCore stores one TP QKV projection.
    transpose_query_key_value: true

name_map:
  huggingface:
    transformer: model.vision_tower.encoder
    layer_prefix: layers
    input_layernorm: layer_norm1
    attention.query_key_value: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj]
    attention.dense: self_attn.out_proj
    post_attention_layernorm: layer_norm2
    mlp.dense_h_to_4h: mlp.fc1
    mlp.dense_4h_to_h: mlp.fc2
  mcore:
    transformer: model
    layer_prefix: vision_model.encoder.layers
    input_layernorm:
      name: input_layernorm
      extra: true
    attention.query_key_value:
      name: self_attention.linear_qkv
      extra: true
    attention.dense:
      name: self_attention.linear_proj
      extra: true
    post_attention_layernorm:
      name: pre_mlp_layernorm
      extra: true
    mlp.dense_h_to_4h:
      name: mlp.linear_fc1
      extra: true
    mlp.dense_4h_to_h:
      name: mlp.linear_fc2
      extra: true
    transformer_tpl: model%d

torch_dtype: bfloat16

# Only MiniCPM-specific modules live here.  The repeated encoder layers above
# are converted by the generic MCore layer converter.
vision_patch:
  vision_model.embeddings.patch_embedding.bias: model.vision_tower.embeddings.patch_embedding.bias
  vision_model.embeddings.patch_embedding.weight: model.vision_tower.embeddings.patch_embedding.weight
  vision_model.embeddings.position_embedding.weight: model.vision_tower.embeddings.position_embedding.weight
  vision_model.post_layernorm.bias: model.vision_tower.post_layernorm.bias
  vision_model.post_layernorm.weight: model.vision_tower.post_layernorm.weight
  vision_model.vit_merger.layer_norm1.bias: model.vision_tower.vit_merger.layer_norm1.bias
  vision_model.vit_merger.layer_norm1.weight: model.vision_tower.vit_merger.layer_norm1.weight
  vision_model.vit_merger.linear_1.bias: model.vision_tower.vit_merger.linear_1.bias
  vision_model.vit_merger.linear_1.weight: model.vision_tower.vit_merger.linear_1.weight
  vision_model.vit_merger.linear_2.bias: model.vision_tower.vit_merger.linear_2.bias
  vision_model.vit_merger.linear_2.weight: model.vision_tower.vit_merger.linear_2.weight
  vision_model.vit_merger.pre_norm.bias: model.vision_tower.vit_merger.pre_norm.bias
  vision_model.vit_merger.pre_norm.weight: model.vision_tower.vit_merger.pre_norm.weight
  vision_model.vit_merger.self_attn.k_proj.bias: model.vision_tower.vit_merger.self_attn.k_proj.bias
  vision_model.vit_merger.self_attn.k_proj.weight: model.vision_tower.vit_merger.self_attn.k_proj.weight
  vision_model.vit_merger.self_attn.out_proj.bias: model.vision_tower.vit_merger.self_attn.out_proj.bias
  vision_model.vit_merger.self_attn.out_proj.weight: model.vision_tower.vit_merger.self_attn.out_proj.weight
  vision_model.vit_merger.self_attn.q_proj.bias: model.vision_tower.vit_merger.self_attn.q_proj.bias
  vision_model.vit_merger.self_attn.q_proj.weight: model.vision_tower.vit_merger.self_attn.q_proj.weight
  vision_model.vit_merger.self_attn.v_proj.bias: model.vision_tower.vit_merger.self_attn.v_proj.bias
  vision_model.vit_merger.self_attn.v_proj.weight: model.vision_tower.vit_merger.self_attn.v_proj.weight
