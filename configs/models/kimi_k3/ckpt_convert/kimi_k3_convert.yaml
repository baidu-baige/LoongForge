hydra:
  searchpath:
    - file://${oc.env:KIMI_K3_CONFIG_ROOT,/tmp/kimi_k3_external_config}
    - file://${oc.env:LOONGFORGE_PATH}/configs/models/

defaults:
  - kimi_k3@module: ???
  - _self_

args:
  common:
    num_layers: ${module.num_layers}
    hidden_size: ${module.hidden_size}
    ffn_hidden_size: ${module.ffn_hidden_size}
    num_attention_heads: ${module.num_attention_heads}
    num_key_value_heads: ${module.num_query_groups}
    vocab_size: ${module.vocab_size_in_config_file}
    num_experts: ${module.num_experts}
  mcore:
    untie_embeddings_and_output_weights: true
    add_embedding_padding: true
    transpose_mlp_dense: true
    transpose_query_key_value: true
    use_rotary_position_embeddings: false
    # K3 uses NoPE; MCore requires this compatibility flag.
    add_position_embedding: true
name_map:
  huggingface:
    word_embeddings: language_model.model.embed_tokens
    transformer: language_model.model
    layer_prefix: layers
    input_layernorm: input_layernorm
    attention.q_down: self_attn.q_a_proj
    attention.q_up: self_attn.q_b_proj
    attention.q_up_layernorm: self_attn.q_a_layernorm
    attention.kv_down: self_attn.kv_a_proj_with_mqa
    attention.kv_up: self_attn.kv_b_proj
    attention.kv_up_layernorm: self_attn.kv_a_layernorm
    attention.dense: self_attn.o_proj
    attention.q_norm: self_attn.q_a_layernorm
    attention.kv_norm: self_attn.kv_a_layernorm
    kimi_k3.attention.q_proj: self_attn.q_proj
    kimi_k3.attention.k_proj: self_attn.k_proj
    kimi_k3.attention.v_proj: self_attn.v_proj
    kimi_k3.attention.q_conv1d: self_attn.q_conv1d
    kimi_k3.attention.k_conv1d: self_attn.k_conv1d
    kimi_k3.attention.v_conv1d: self_attn.v_conv1d
    kimi_k3.attention.f_a_proj: self_attn.f_a_proj
    kimi_k3.attention.f_b_proj: self_attn.f_b_proj
    kimi_k3.attention.b_proj: self_attn.b_proj
    kimi_k3.attention.g_proj: self_attn.g_proj
    kimi_k3.attention.A_log:
      name: self_attn.A_log
      is_direct_name: true
    kimi_k3.attention.dt_bias:
      name: self_attn.dt_bias
      is_direct_name: true
    kimi_k3.attention.o_norm: self_attn.o_norm
    kimi_k3.self_attention_res_norm: self_attention_res_norm
    kimi_k3.self_attention_res_proj: self_attention_res_proj
    kimi_k3.mlp_res_norm: mlp_res_norm
    kimi_k3.mlp_res_proj: mlp_res_proj
    kimi_k3.moe.fc1_latent_proj: block_sparse_moe.routed_expert_down_proj
    kimi_k3.moe.routed_expert_norm: block_sparse_moe.routed_expert_norm
    kimi_k3.moe.fc2_latent_proj: block_sparse_moe.routed_expert_up_proj
    post_attention_layernorm: post_attention_layernorm
    moe.gate: block_sparse_moe.gate
    moe.gate.bias: block_sparse_moe.gate.e_score_correction_bias
    moe.expert: block_sparse_moe.experts
    moe.shared_expert: block_sparse_moe.shared_experts
    moe.expert_h_to_4h:
      - w1
      - w3
    moe.expert_4h_to_h: w2
    moe.shared_expert_h_to_4h:
      - gate_proj
      - up_proj
    moe.shared_expert_4h_to_h: down_proj
    mlp.dense_h_to_4h:
      - mlp.gate_proj
      - mlp.up_proj
    mlp.dense_4h_to_h: mlp.down_proj
    final_layernorm: language_model.model.norm
    word_embeddings_for_head: language_model.lm_head
    kimi_k3.output_attn_res_norm:
      name: language_model.model.output_attn_res_norm
      is_direct_name: false
    kimi_k3.output_attn_res_proj:
      name: language_model.model.output_attn_res_proj
      is_direct_name: false
  mcore:
    word_embeddings: embedding.word_embeddings
    transformer: model
    layer_prefix: decoder.layers
    input_layernorm: input_layernorm
    attention.q_down:
      name: self_attention.q_a_proj
      extra: true
    attention.q_up:
      name: self_attention.q_b_proj
      extra: true
    attention.q_up_layernorm: self_attention.q_a_layernorm
    attention.kv_down:
      name: self_attention.kv_a_proj_with_mqa
      extra: true
    attention.kv_up:
      name: self_attention.kv_b_proj
      extra: true
    attention.kv_up_layernorm: self_attention.kv_a_layernorm
    attention.dense:
      name: self_attention.o_proj
      extra: true
    attention.q_norm: self_attention.q_a_layernorm
    attention.kv_norm: self_attention.kv_a_layernorm
    kimi_k3.attention.q_proj:
      name: self_attention.q_proj
      extra: true
    kimi_k3.attention.k_proj:
      name: self_attention.k_proj
      extra: true
    kimi_k3.attention.v_proj:
      name: self_attention.v_proj
      extra: true
    kimi_k3.attention.q_conv1d: self_attention.q_conv1d
    kimi_k3.attention.k_conv1d: self_attention.k_conv1d
    kimi_k3.attention.v_conv1d: self_attention.v_conv1d
    kimi_k3.attention.f_a_proj:
      name: self_attention.f_a_proj
      extra: true
    kimi_k3.attention.f_b_proj:
      name: self_attention.f_b_proj
      extra: true
    kimi_k3.attention.b_proj:
      name: self_attention.b_proj
      extra: true
    kimi_k3.attention.g_proj:
      name: self_attention.g_proj
      extra: true
    kimi_k3.attention.A_log:
      name: self_attention.A_log
      is_direct_name: true
    kimi_k3.attention.dt_bias:
      name: self_attention.dt_bias
      is_direct_name: true
    kimi_k3.attention.o_norm: self_attention.o_norm
    kimi_k3.self_attention_res_norm: self_attention_res_norm
    kimi_k3.self_attention_res_proj: self_attention_res_proj
    kimi_k3.mlp_res_norm: mlp_res_norm
    kimi_k3.mlp_res_proj: mlp_res_proj
    kimi_k3.moe.fc1_latent_proj: mlp.fc1_latent_proj
    kimi_k3.moe.routed_expert_norm: mlp.routed_expert_norm
    kimi_k3.moe.fc2_latent_proj: mlp.fc2_latent_proj
    post_attention_layernorm: pre_mlp_layernorm
    moe.gate: mlp.router
    moe.gate.bias:
      name: mlp.router.expert_bias
      is_direct_name: true
      ignore_tp: true
    moe.expert: mlp.experts.local_experts
    moe.groupedgemm.expert: mlp.experts
    moe.shared_expert: mlp.shared_experts
    moe.expert_h_to_4h:
      name: linear_fc1
      extra: true
    moe.expert_4h_to_h:
      name: linear_fc2
      extra: true
    moe.shared_expert_h_to_4h:
      name: mlp.shared_experts.linear_fc1
      extra: true
    moe.shared_expert_4h_to_h:
      name: mlp.shared_experts.linear_fc2
      extra: true
    mlp.dense_h_to_4h:
      name: mlp.linear_fc1
      extra: true
    mlp.dense_4h_to_h:
      name: mlp.linear_fc2
      extra: true
    final_layernorm:
      name: decoder.final_layernorm
      extra: true
    word_embeddings_for_head: output_layer
    kimi_k3.output_attn_res_norm: output_attn_res_norm
    kimi_k3.output_attn_res_proj: output_attn_res_proj
    transformer_tpl: model%d

# K3 keeps MLA down projections replicated.
tensor_parallel_dim:
  kimi_k3.attention.q_proj.weight: 0
  kimi_k3.attention.k_proj.weight: 0
  kimi_k3.attention.v_proj.weight: 0
  kimi_k3.attention.q_conv1d.weight: 0
  kimi_k3.attention.k_conv1d.weight: 0
  kimi_k3.attention.v_conv1d.weight: 0
  kimi_k3.attention.f_b_proj.weight: 0
  kimi_k3.attention.b_proj.weight: 0
  kimi_k3.attention.g_proj.weight: 0
  attention.q_down.weight: null
  attention.kv_down.weight: null

torch_dtype: bfloat16
