name: Build

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install --upgrade pip 'build==1.6.0' 'twine==7.0.0'

      - run: python -m build --sdist --wheel --outdir dist/

      - run: twine check dist/*

      - name: Verify wheel configuration data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          required = {
              "loongforge/_configs/data/sft_dataset_config.yaml",
              "loongforge/_configs/models/qwen3",
          }
          for path in required:
              assert any(name == path or name.startswith(path + "/") for name in names), path
          PY

      - name: Install wheel without optional dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps dist/*.whl

      - name: Installed wheel import and CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python -c "import loongforge; print(loongforge.__file__)"
          python -c "from loongforge.config_paths import resolve_config; assert list(resolve_config('configs/models/qwen3').glob('*.yaml'))"
          LoongForge --help
          version="$(python -c 'from importlib.metadata import version; print(version("LoongForge"))')"
          test "$(LoongForge --version)" = "LoongForge $version"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7
