name: Build

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install --upgrade pip build twine

      - run: python -m build --sdist --wheel --outdir dist/

      - run: twine check dist/*

      - name: Install wheel without optional dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps dist/*.whl

      - name: Import smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python -c "import loongforge; print(loongforge.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
