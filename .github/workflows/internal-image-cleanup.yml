name: Internal Image Cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Candidate image target
        required: true
        default: all
        type: choice
        options: [a, h, p, all]
      retention_days:
        description: Delete candidates older than this many days
        required: true
        default: '14'
        type: string
      dry_run:
        description: Report candidates without deleting them
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: internal-image-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_IMAGE) }}
    environment: internal-registry
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Delete expired candidate images
        env:
          INTERNAL_REGISTRY_USERNAME: ${{ secrets.INTERNAL_REGISTRY_USERNAME }}
          INTERNAL_REGISTRY_PASSWORD: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}
          IMAGE_CLEANUP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          .github/scripts/self_runner/cleanup_candidate_images.sh \
            --target "${{ inputs.target || 'all' }}" \
            --retention-days "${{ inputs.retention_days || '14' }}"
