name: PyTorch Compatibility

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      torch-versions:
        description: 'Comma-separated PyTorch versions (empty selects the newest release in each of the two latest stable series)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pytorch-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Select PyTorch versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        name: Select upstream stable releases
        shell: python
        env:
          TORCH_VERSIONS: ${{ inputs.torch-versions }}
        run: |
          import json
          import os
          import re
          import urllib.request

          with urllib.request.urlopen("https://pypi.org/pypi/torch/json") as response:
              metadata = json.load(response)

          if os.environ.get("TORCH_VERSIONS", "").strip():
              versions = [
                  item.strip()
                  for item in os.environ["TORCH_VERSIONS"].split(",")
                  if item.strip()
              ]
          else:
              stable = {
                  version
                  for version in metadata["releases"]
                  if re.fullmatch(r"\d+(?:\.\d+)*", version)
              }
              latest_by_series = {}
              for version in stable:
                  series = ".".join(version.split(".")[:2])
                  release = tuple(int(part) for part in version.split("."))
                  if series not in latest_by_series or release > latest_by_series[series][0]:
                      latest_by_series[series] = (release, version)
              versions = [
                  latest_by_series[series][1]
                  for series in sorted(
                      latest_by_series,
                      key=lambda series: tuple(int(part) for part in series.split(".")),
                      reverse=True,
                  )[:2]
              ]

          if not versions:
              raise SystemExit("no PyTorch versions selected")
          for version in versions:
              if version not in metadata["releases"]:
                  raise SystemExit(f"unknown PyTorch version: {version}")

          matrix = {"torch-version": versions}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          print(f"Selected PyTorch versions: {', '.join(versions)}")

  compatibility:
    name: PyTorch ${{ matrix.torch-version }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PyTorch
        run: python -m pip install "torch==${{ matrix.torch-version }}"

      - name: Build wheel
        run: |
          python -m pip install 'build==1.6.0'
          python -m build --wheel --outdir dist/

      - name: Install wheel without optional dependencies
        run: python -m pip install --no-deps dist/*.whl

      - name: Run PyTorch compatibility tests
        env:
          EXPECTED_TORCH_VERSION: ${{ matrix.torch-version }}
        run: |
          python -m pip install 'pytest==9.1.1'
          python -m pytest -q tests/test_pytorch_compatibility.py
