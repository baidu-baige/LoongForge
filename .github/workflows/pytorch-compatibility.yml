name: PyTorch Compatibility

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      torch-versions:
        description: 'Comma-separated stable PyTorch versions (empty selects the latest two series)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pytorch-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  PYTHON_VERSIONS: '3.10,3.11,3.12'
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  versions:
    name: Select PyTorch versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip with JSON index output
        run: python -m pip install 'pip>=25.1'

      - id: select
        name: Select stable CPU releases
        env:
          PYTHON_VERSIONS: ${{ env.PYTHON_VERSIONS }}
          TORCH_VERSIONS: ${{ inputs.torch-versions }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip index versions torch --json --only-binary=:all: \
            --index-url "$TORCH_CPU_INDEX" \
            | python .github/scripts/select_pytorch_versions.py

  compatibility:
    name: Python ${{ matrix.python-version }} / PyTorch ${{ matrix.torch-version }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PyTorch CPU wheel
        env:
          EXPECTED_TORCH_VERSION: ${{ matrix.torch-version }}
        run: |
          python -m pip install --only-binary=:all: --index-url "$TORCH_CPU_INDEX" \
            "torch==${EXPECTED_TORCH_VERSION}"
          python -c "import sys, torch; print(f'Python {sys.version}'); print(f'PyTorch {torch.__version__}')"

      - name: Build and install LoongForge
        run: |
          python -m pip install 'build==1.6.0' 'pytest==9.1.1'
          python -m build --wheel --outdir dist/
          python -m pip install --no-deps dist/*.whl

      - name: Run installed-wheel compatibility tests
        env:
          EXPECTED_TORCH_VERSION: ${{ matrix.torch-version }}
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cp tests/test_pytorch_compatibility.py "$smoke_dir/"
          cd "$smoke_dir"
          python -m pytest -q -s test_pytorch_compatibility.py
