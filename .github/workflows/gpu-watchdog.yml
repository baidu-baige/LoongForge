name: GPU Regression Watchdog

on:
  workflow_run:
    workflows: ['GPU Regression']
    types: [completed]

permissions:
  actions: read
  checks: write

jobs:
  finalize_stale_check:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Finalize cancelled or failed GPU check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        with:
          script: |
            const runName = process.env.RUN_NAME || '';
            const match = runName.match(/^GPU Regression PR #(\d+) (mcore|torch) ([0-9a-f]{40})$/);
            if (!match) {
              core.warning('GPU workflow run name has no immutable PR/suite identity; no check was changed.');
              return;
            }
            const [, prNumber, suite, headSha] = match;
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: headSha,
              check_name: 'gpu-regression',
              per_page: 100,
            });
            const stale = checks.check_runs.filter((check) => {
              if (check.status !== 'in_progress' || check.head_sha !== headSha) return false;
              const text = `${check.output?.title || ''} ${check.output?.summary || ''}`;
              return text.includes(suite);
            });
            const conclusion = process.env.RUN_CONCLUSION === 'cancelled' ? 'cancelled' : 'failure';
            for (const check of stale) {
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion,
                completed_at: new Date().toISOString(),
                details_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${process.env.RUN_ID}`,
                output: {
                  title: conclusion === 'cancelled'
                    ? 'GPU validation cancelled'
                    : 'GPU validation failed',
                  summary: `PR #${prNumber}; suite: ${suite}; workflow watchdog finalized run ${process.env.RUN_ID}.`,
                },
              });
            }
