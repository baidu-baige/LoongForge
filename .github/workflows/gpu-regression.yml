name: GPU Regression

run-name: >-
  GPU Regression PR #${{ inputs.pr_number }} ${{ inputs.suite }}
  ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      tree_sha:
        required: false
        default: ''
        type: string
      suite:
        required: true
        type: string
      models:
        required: false
        type: string
      build_image:
        required: false
        default: false
        type: boolean
      gate_check_id:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      tree_sha: ${{ steps.validate.outputs.tree_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: validate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REPO: ${{ inputs.head_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_TREE_SHA: ${{ inputs.tree_sha }}
          SUITE: ${{ inputs.suite }}
          ENABLE_MCORE: ${{ vars.CI_ENABLE_MCORE }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pull.head.sha !== process.env.HEAD_SHA) {
              core.setFailed('the requested revision is no longer the PR head');
              return;
            }
            if (pull.head.repo.full_name !== process.env.HEAD_REPO) {
              core.setFailed('head repository does not match the pull request');
              return;
            }
            if (!['mcore', 'torch'].includes(process.env.SUITE)) {
              core.setFailed('invalid test suite');
              return;
            }
            if (process.env.SUITE === 'mcore' && process.env.ENABLE_MCORE !== 'true') {
              core.setFailed('the requested GPU suite is disabled by repository configuration');
              return;
            }
            const [headOwner, headRepo] = process.env.HEAD_REPO.split('/');
            const { data: headCommit } = await github.rest.repos.getCommit({
              owner: headOwner,
              repo: headRepo,
              ref: process.env.HEAD_SHA,
            });
            const treeSha = headCommit.commit.tree.sha;
            if (process.env.INPUT_TREE_SHA && process.env.INPUT_TREE_SHA !== treeSha) {
              core.setFailed('tree SHA does not match the immutable head commit');
              return;
            }
            core.setOutput('tree_sha', treeSha);
      - name: Validate models against suite manifest
        uses: ./.github/actions/validate-models
        with:
          suite: ${{ inputs.suite }}
          models: ${{ inputs.models }}
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          baseline_alias: ${{ inputs.suite == 'torch' && 'p' || 'a' }}

  mcore:
    needs: validate
    if: ${{ needs.validate.result == 'success' && inputs.suite == 'mcore' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_A) }}
    timeout-minutes: 360
    concurrency:
      group: gpu-regression-${{ inputs.pr_number }}-mcore
      cancel-in-progress: true
    steps:
      - name: Revalidate current PR head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REPO: ${{ inputs.head_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pull.head.sha !== process.env.HEAD_SHA ||
                pull.head.repo?.full_name !== process.env.HEAD_REPO) {
              core.setFailed('the requested revision is no longer the PR head');
            }
      - name: Checkout trusted CI scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: trusted-ci
          persist-credentials: false
          submodules: false
      - name: Checkout immutable PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          path: source
          persist-credentials: false
          submodules: recursive
      - name: Verify immutable source tree
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          test -z "$(git -C source submodule status --recursive | grep -E '^[+-]' || true)"
      - name: Preflight self-hosted runner
        run: trusted-ci/.github/scripts/self_runner/preflight.sh mcore "${{ inputs.build_image && 'true' || 'false' }}"
      - name: Report candidate image build
        if: ${{ inputs.build_image && inputs.gate_check_id != '' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'in_progress',
              output: {
                title: 'Building candidate image',
                summary: `PR #${process.env.PR_NUMBER}; suite: ${process.env.SUITE}`,
              },
            });
      - id: candidate
        name: Build candidate image
        if: ${{ inputs.build_image }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
        run: trusted-ci/.github/scripts/build_candidate_image.sh auto
      - name: Report regression run
        if: ${{ inputs.gate_check_id != '' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'in_progress',
              output: {
                title: `Running ${process.env.SUITE} regression`,
                summary: `PR #${process.env.PR_NUMBER}; suite: ${process.env.SUITE}`,
              },
            });
      - id: regression
        name: Run MCore regression
        env:
          MODELS: ${{ inputs.models || (inputs.suite == 'torch' && 'pi05_ddp' || 'deepseek_v2_lite') }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
          LOONGFORGE_REGRESSION_RUNNER: ${{ github.workspace }}/trusted-ci/.github/scripts/self_runner/run_regression.sh
        run: trusted-ci/.github/scripts/run_regression.sh mcore
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpu-llm-vlm-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: loongforge-artifacts
          if-no-files-found: error
          retention-days: 7

  torch:
    needs: validate
    if: ${{ needs.validate.result == 'success' && inputs.suite == 'torch' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_P) }}
    timeout-minutes: 360
    outputs:
      regression_summary: ${{ steps.suite_summary.outputs.markdown }}
    concurrency:
      group: gpu-regression-${{ inputs.pr_number }}-torch
      cancel-in-progress: true
    steps:
      - name: Revalidate current PR head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REPO: ${{ inputs.head_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pull.head.sha !== process.env.HEAD_SHA ||
                pull.head.repo?.full_name !== process.env.HEAD_REPO) {
              core.setFailed('the requested revision is no longer the PR head');
            }
      - name: Checkout trusted CI scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: trusted-ci
          persist-credentials: false
          submodules: false
      - name: Checkout immutable PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          path: source
          persist-credentials: false
          submodules: recursive
      - name: Verify immutable source tree
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          test -z "$(git -C source submodule status --recursive | grep -E '^[+-]' || true)"
      - name: Preflight self-hosted runner
        run: trusted-ci/.github/scripts/self_runner/preflight.sh torch "${{ inputs.build_image && 'true' || 'false' }}"
      - name: Report candidate image build
        if: ${{ inputs.build_image && inputs.gate_check_id != '' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'in_progress',
              output: {
                title: 'Building candidate image',
                summary: `PR #${process.env.PR_NUMBER}; suite: ${process.env.SUITE}`,
              },
            });
      - id: candidate
        name: Build candidate image
        if: ${{ inputs.build_image }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
        run: trusted-ci/.github/scripts/build_candidate_image.sh auto
      - name: Report regression run
        if: ${{ inputs.gate_check_id != '' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'in_progress',
              output: {
                title: `Running ${process.env.SUITE} regression`,
                summary: `PR #${process.env.PR_NUMBER}; suite: ${process.env.SUITE}`,
              },
            });
      - id: regression
        name: Run Torch regression
        env:
          MODELS: ${{ inputs.models || (inputs.suite == 'torch' && 'pi05_ddp' || 'deepseek_v2_lite') }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
          LOONGFORGE_REGRESSION_RUNNER: ${{ github.workspace }}/trusted-ci/.github/scripts/self_runner/run_regression.sh
        run: trusted-ci/.github/scripts/run_regression.sh torch
      - id: suite_summary
        name: Render suite summary
        # The launcher copies the regression framework's results.json into
        # the artifact directory and exports its path; render it as markdown
        # for the pull request check run. Never blocks the regression result.
        if: ${{ always() && steps.regression.outputs.suite_results != '' }}
        continue-on-error: true
        run: |
          python3 "trusted-ci/.github/scripts/summarize_suite_results.py" \
            "${{ steps.regression.outputs.suite_results }}" > suite-summary.md
          {
            echo 'markdown<<SUITE_SUMMARY_EOF'
            cat suite-summary.md
            echo 'SUITE_SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpu-torch-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: loongforge-artifacts
          if-no-files-found: error
          retention-days: 7

  finalize:
    timeout-minutes: 70
    needs: [validate, mcore, torch]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow-level set, so re-declare
      # everything this job needs: checkout (contents), the check run
      # (checks), and the summary comment on the pull request
      # (pull-requests).
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          MCORE_RESULT: ${{ needs.mcore.result }}
          TORCH_RESULT: ${{ needs.torch.result }}
          SUITE: ${{ inputs.suite }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REGRESSION_SUMMARY: ${{ needs.torch.outputs.regression_summary }}
        with:
          script: |
            const { gpuConclusion } = require('./.github/scripts/gpu_checks');
            // CPU checks are aggregated by the static-checks workflow's gate
            // job; this workflow reports the GPU suites only.
            const results = {
              validate: process.env.VALIDATE_RESULT,
              mcore: process.env.MCORE_RESULT,
              torch: process.env.TORCH_RESULT,
            };

            // A failed suite job is a real failure: mark the check failed,
            // fail this job, and post the result comment so the pull
            // request shows why. A suite job that was cancelled mid-run
            // keeps the cancelled conclusion (the author stopped it); a
            // skipped suite (for example failed validation) is a failure.
            const { conclusion, failed } = gpuConclusion(results, process.env.SUITE);
            const regressionSummary = process.env.REGRESSION_SUMMARY.trim();
            const checkOutput = {
              title: conclusion === 'success'
                ? 'GPU validation passed'
                : (conclusion === 'cancelled' ? 'GPU validation cancelled' : 'GPU validation failed'),
              summary: `Suite: ${process.env.SUITE}; results: ${JSON.stringify(results)}`,
            };
            // The Checks API rejects an explicit null output.text. Leave the
            // optional field out when a suite failed before rendering results.
            if (regressionSummary) checkOutput.text = regressionSummary;
            let checkId = Number(process.env.CHECK_ID);
            if (!Number.isSafeInteger(checkId) || checkId <= 0) {
              const { data: created } = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'gpu-regression',
                head_sha: process.env.HEAD_SHA,
                external_id: `loongforge-gpu:${process.env.PR_NUMBER}:${process.env.HEAD_SHA}`,
                status: 'in_progress',
                started_at: new Date().toISOString(),
                details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              checkId = created.id;
            }
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkId,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              // The check run is created by a dispatch workflow whose commit
              // differs from the pull request head, so GitHub files it under
              // an unrelated check suite (for example the auto-label run).
              // Point the details link at the real regression run.
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              // Per-model regression detail (loss baseline comparisons,
              // failed metrics, warnings) is included when the suite runner
              // reached its summary step.
              output: checkOutput,
            });

            // Mirror the outcome as a pull request comment from the
            // github-actions bot. A hidden marker keyed by head SHA makes
            // re-runs against the same revision update one comment instead
            // of spamming the conversation.
            const prNumber = Number(process.env.PR_NUMBER);
            if (Number.isSafeInteger(prNumber) && prNumber > 0 && conclusion !== 'cancelled') {
              const marker = `<!-- loongforge-gpu-regression:${process.env.HEAD_SHA} -->`;
              const icon = conclusion === 'success' ? '✅' : '❌';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const commentBody = [
                marker,
                `### ${icon} GPU regression — ${process.env.SUITE}`,
                '',
                `Verdict: **${conclusion}** · commit \`${process.env.HEAD_SHA.slice(0, 12)}\` · [workflow run](${runUrl})`,
                '',
                regressionSummary || 'Per-model detail is unavailable for this suite.',
              ].join('\n');

              const existing = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const target = existing.find(
                (comment) =>
                  comment.user?.login === 'github-actions[bot]' &&
                  typeof comment.body === 'string' &&
                  comment.body.includes(marker),
              );
              if (target) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: target.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody,
                });
              }
            }
            if (conclusion === 'failure') core.setFailed(`failed checks: ${failed.join(', ')}`);
