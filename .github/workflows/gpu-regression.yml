name: GPU Regression

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      tree_sha:
        required: false
        default: ''
        type: string
      environments:
        required: true
        type: string
      models:
        required: false
        type: string
      build_image:
        required: false
        type: string
      gate_check_id:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: gpu-regression-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.validate.outputs.envs }}
      tree_sha: ${{ steps.validate.outputs.tree_sha }}
    steps:
      - id: validate
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REPO: ${{ inputs.head_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_TREE_SHA: ${{ inputs.tree_sha }}
          ENVIRONMENTS: ${{ inputs.environments }}
          MODELS: ${{ inputs.models }}
          BUILD_IMAGE: ${{ inputs.build_image }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pull.head.sha !== process.env.HEAD_SHA) {
              core.setFailed('the requested revision is no longer the PR head');
              return;
            }
            if (pull.head.repo.full_name !== process.env.HEAD_REPO) {
              core.setFailed('head repository does not match the pull request');
              return;
            }
            let envs;
            try {
              envs = JSON.parse(process.env.ENVIRONMENTS);
            } catch (error) {
              core.setFailed(`invalid logical environment list: ${error.message}`);
              return;
            }
            if (!Array.isArray(envs) || envs.some((env) => !['a', 'p'].includes(env))) {
              core.setFailed('invalid logical environment list');
              return;
            }
            const models = process.env.MODELS.split(',').map((model) => model.trim()).filter(Boolean);
            if (models.some((model) => !/^[A-Za-z0-9._-]+$/.test(model))) {
              core.setFailed('invalid model list');
              return;
            }
            if (process.env.BUILD_IMAGE && !['a', 'h', 'p'].includes(process.env.BUILD_IMAGE)) {
              core.setFailed('invalid image build target');
              return;
            }
            const [headOwner, headRepo] = process.env.HEAD_REPO.split('/');
            const { data: headCommit } = await github.rest.repos.getCommit({
              owner: headOwner,
              repo: headRepo,
              ref: process.env.HEAD_SHA,
            });
            const treeSha = headCommit.commit.tree.sha;
            if (process.env.INPUT_TREE_SHA && process.env.INPUT_TREE_SHA !== treeSha) {
              core.setFailed('tree SHA does not match the immutable head commit');
              return;
            }
            core.setOutput('envs', JSON.stringify([...new Set(envs)]));
            core.setOutput('tree_sha', treeSha);

  image:
    needs: validate
    if: ${{ inputs.build_image != '' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_IMAGE) }}
    environment: internal-registry
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
    steps:
      - name: Checkout trusted CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: trusted-ci
          persist-credentials: false
          submodules: false
      - name: Checkout immutable PR source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          path: source
          persist-credentials: false
          submodules: recursive
      - name: Verify immutable source tree
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          test -z "$(git -C source submodule status --recursive | grep -E '^[+-]' || true)"
      - id: candidate
        name: Build candidate image
        env:
          BUILD_TARGET: ${{ inputs.build_image }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
          INTERNAL_REGISTRY_USERNAME: ${{ secrets.INTERNAL_REGISTRY_USERNAME }}
          INTERNAL_REGISTRY_PASSWORD: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}
        run: trusted-ci/.github/scripts/build_candidate_image.sh "$BUILD_TARGET"

  a:
    needs: [validate, image]
    if: ${{ always() && needs.validate.result == 'success' && contains(fromJSON(needs.validate.outputs.envs), 'a') && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_A) }}
    steps:
      - name: Checkout trusted CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: trusted-ci
          persist-credentials: false
          submodules: false
      - name: Checkout immutable PR source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          path: source
          persist-credentials: false
          submodules: recursive
      - id: regression
        name: Run baseline regression
        env:
          CI_CONFIG_PROFILE: ${{ vars.CI_CONFIG_PROFILE_A }}
          MODELS: ${{ inputs.models }}
          CANDIDATE_REVISION: ${{ needs.image.outputs.revision }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
        run: trusted-ci/.github/scripts/run_regression.sh a
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-a-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: |
            ${{ steps.regression.outputs.result_json }}
            ${{ steps.regression.outputs.log_file }}
          if-no-files-found: error
          retention-days: 7

  p:
    needs: [validate, image]
    if: ${{ always() && needs.validate.result == 'success' && contains(fromJSON(needs.validate.outputs.envs), 'p') && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_P) }}
    steps:
      - name: Checkout trusted CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: trusted-ci
          persist-credentials: false
          submodules: false
      - name: Checkout immutable PR source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          path: source
          persist-credentials: false
          submodules: recursive
      - id: regression
        name: Run baseline regression
        env:
          CI_CONFIG_PROFILE: ${{ vars.CI_CONFIG_PROFILE_P }}
          MODELS: ${{ inputs.models }}
          CANDIDATE_REVISION: ${{ needs.image.outputs.revision }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
        run: trusted-ci/.github/scripts/run_regression.sh p
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-p-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: |
            ${{ steps.regression.outputs.result_json }}
            ${{ steps.regression.outputs.log_file }}
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: [validate, image, a, p]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          A_RESULT: ${{ needs.a.result }}
          P_RESULT: ${{ needs.p.result }}
          ENVIRONMENTS: ${{ inputs.environments }}
          BUILD_IMAGE: ${{ inputs.build_image }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const results = Object.fromEntries([
              ['validate', process.env.VALIDATE_RESULT],
              ['image', process.env.IMAGE_RESULT],
              ['a', process.env.A_RESULT],
              ['p', process.env.P_RESULT],
            ]);
            const requested = JSON.parse(process.env.ENVIRONMENTS);
            const requiredJobs = ['validate', ...requested];
            if (process.env.BUILD_IMAGE) requiredJobs.push('image');
            const failed = requiredJobs.filter((name) => results[name] !== 'success');

            const cpuNames = ['check', 'spdx', 'gitleaks', 'ruff', 'build', 'actionlint'];
            const isNamedJob = (check, name) =>
              check.name === name || check.name.endsWith(` / ${name}`);
            let checkRuns = [];
            for (let attempt = 0; attempt < 120; attempt += 1) {
              checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.HEAD_SHA,
                per_page: 100,
              });
              const terminal = cpuNames.every((name) => checkRuns.some((check) =>
                isNamedJob(check, name) && check.status === 'completed'
              ));
              if (terminal) break;
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }
            const missingCpu = cpuNames.filter((name) =>
              !checkRuns.some((check) => isNamedJob(check, name) && check.conclusion === 'success')
            );
            failed.push(...missingCpu.map((name) => `cpu:${name}`));
            const conclusion = failed.length ? 'failure' : 'success';
            let checkId = Number(process.env.CHECK_ID);
            if (!Number.isSafeInteger(checkId) || checkId <= 0) {
              const { data: created } = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'ci-gate',
                head_sha: process.env.HEAD_SHA,
                external_id: `loongforge-gpu:${process.env.PR_NUMBER}:${process.env.HEAD_SHA}`,
                status: 'in_progress',
                started_at: new Date().toISOString(),
              });
              checkId = created.id;
            }
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkId,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: conclusion === 'success' ? 'GPU validation passed' : 'GPU validation failed',
                summary: `Results: ${JSON.stringify(results)}`,
              },
            });
            if (failed.length) core.setFailed(`failed checks: ${failed.join(', ')}`);
