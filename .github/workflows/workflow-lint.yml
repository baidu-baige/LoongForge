name: Workflow Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: '1.25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"
      - name: Validate YAML documents
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              yaml.safe_load(path.read_text())
              print(path)
          PY
      - name: Run CI helper tests
        run: node --test tests/test_ci_helpers.js
      - name: Run CI Python tests
        run: |
          python -m pip install 'pytest==9.1.1'
          # Only the CI-helper tests run here: the rest of tests/ needs torch
          # and accelerator hardware, which this runner does not have.
          python -m pytest -q \
            tests/test_ci_artifacts.py \
            tests/test_ci_command.py \
            tests/test_ci_summary.py \
            tests/test_doc_links.py \
            tests/test_image_policy.py \
            tests/test_release_infrastructure.py \
            tests/test_release_request.py \
            tests/test_release_regression_harness.py \
            tests/test_sensitive_scan.py \
            tests/test_vlm_dataloader_read_order.py
