name: GPU Regression Invalidation

on:
  pull_request_target:
    types: [synchronize]

permissions: {}

jobs:
  invalidate_mcore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gpu-regression-${{ github.event.pull_request.number }}-mcore
      cancel-in-progress: true
    steps:
      - name: Invalidate stale MCore work
        run: echo "Cancelled stale MCore GPU work for this pull request, if any."

  invalidate_native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gpu-regression-${{ github.event.pull_request.number }}-torch
      cancel-in-progress: true
    steps:
      - name: Invalidate stale torch work
        run: echo "Cancelled stale torch GPU work for this pull request, if any."

  # The two jobs above only exist to steal the suite concurrency groups and
  # cancel in-flight GPU work; both always succeed, so their green ticks say
  # nothing about GPU results. Meanwhile check runs are bound to a commit SHA,
  # so the previous revision's `gpu-regression` check does not become stale —
  # the new head simply has no such check, and GPU validation silently reverts
  # to un-run. Re-publish it as `action_required` on the new head so the pull
  # request shows that this revision still needs `/ok-to-test`.
  require_revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const {
              findActionRequiredCheck,
              hasGpuValidation,
            } = require('./.github/scripts/gpu_checks');
            const previousSha = process.env.PREVIOUS_SHA || '';
            const currentSha = process.env.CURRENT_SHA || '';
            if (!/^[0-9a-f]{40}$/.test(currentSha)) {
              core.setFailed('pull request head SHA is missing or malformed');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pull.head.sha !== currentSha) {
              core.setFailed('pull request head changed while invalidation was starting');
              return;
            }

            // `before` is only the immediately previous head. A PR can receive
            // several commits between GPU runs, so also inspect the bot's
            // result comments to retain the opt-in decision across those hops.
            const previous = /^[0-9a-f]{40}$/.test(previousSha)
              ? await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: previousSha,
                check_name: 'gpu-regression',
                per_page: 100,
              })
              : [];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            if (!hasGpuValidation(previous, comments)) {
              console.log('No prior GPU validation for this pull request; nothing to invalidate.');
              return;
            }

            const current = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: currentSha,
              check_name: 'gpu-regression',
              per_page: 100,
            });
            const existing = findActionRequiredCheck(current, currentSha);
            const previousLabel = previousSha ? `Revision \`${previousSha.slice(0, 12)}\`` : 'An earlier revision';
            const summary = [
              `${previousLabel} was validated on GPU;`,
              `\`${currentSha.slice(0, 12)}\` has not been.`,
              '',
              'Comment `/ok-to-test` to revalidate this revision.',
            ].join('\n');
            // `action_required` rather than `neutral`: neutral counts as a pass
            // for required status checks, which would make this marker
            // toothless the moment branch protection starts enforcing them.
            const checkInput = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gpu-regression',
              head_sha: currentSha,
              external_id: `loongforge-gpu:${process.env.PR_NUMBER}:${currentSha}`,
              status: 'completed',
              conclusion: 'action_required',
              completed_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${process.env.PR_NUMBER}`,
              output: {
                title: 'GPU validation is out of date',
                summary,
              },
            };
            if (existing) {
              await github.rest.checks.update({
                check_run_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                status: checkInput.status,
                conclusion: checkInput.conclusion,
                completed_at: checkInput.completed_at,
                details_url: checkInput.details_url,
                output: checkInput.output,
              });
            } else {
              await github.rest.checks.create(checkInput);
            }
