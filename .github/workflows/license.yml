name: License Header

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: license-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  spdx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pre-commit
        if: github.event_name == 'pull_request'
        run: pip install pre-commit

      - name: Skip outside a pull request
        if: github.event_name != 'pull_request'
        run: echo "License diff validation is only applicable to pull requests."

      - name: Compute newly added files
        id: new
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          # Keep the listing separate from the filter: a failing `git diff` has to
          # fail the step, while `grep` exiting 1 only means the filter emptied
          # the list. Piping them together hid both behind the same `|| true`.
          git diff --name-only --diff-filter=A "$BASE" "$HEAD" \
              -- '*.py' '*.sh' '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.cu' '*.cuh' > added_files.txt
          grep -vE '^third_party/' added_files.txt > new_files.txt || true
          grep -Ei '\.(py|sh)$' new_files.txt > script_files.txt || true
          grep -Ei '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|cu|cuh)$' new_files.txt > cpp_files.txt || true
          if [ -s new_files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi
          echo "--- newly added files ---"
          cat new_files.txt || true
          echo "--- script files ---"
          cat script_files.txt || true
          echo "--- C/C++/CUDA files ---"
          cat cpp_files.txt || true

      - name: Run SPDX check for Python and Shell
        if: steps.new.outputs.has_files == 'true'
        shell: bash
        run: |
          if [ -s script_files.txt ]; then
            xargs -a script_files.txt pre-commit run spdx-check-script --files
          fi

      - name: Run SPDX check for C/C++/CUDA
        if: steps.new.outputs.has_files == 'true'
        shell: bash
        run: |
          if [ -s cpp_files.txt ]; then
            xargs -a cpp_files.txt pre-commit run spdx-check-cpp --files
          fi
