name: Python Package Release

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Package registry
        type: choice
        required: true
        default: check
        options:
          - check
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'baidu-baige/LoongForge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate publication ref
        if: inputs.destination != 'check'
        shell: bash
        env:
          DESTINATION: ${{ inputs.destination }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable_version='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          rc_suffix='(-rc\.(0|[1-9][0-9]*))?'
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v${stable_version}${rc_suffix}$ ]]; then
            echo "Select a version tag to publish." >&2
            exit 1
          fi
          if [[ "$DESTINATION" == pypi && ! "$GITHUB_REF" =~ ^refs/tags/v${stable_version}$ ]]; then
            echo "PyPI publication requires a stable version tag." >&2
            exit 1
          fi
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "Release tag must match project.version." >&2
            exit 1
          fi
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${GITHUB_SHA}" --jq .status)"
          if [[ "$status" != "behind" && "$status" != "identical" ]]; then
            echo "Release tag must point to a commit on master." >&2
            exit 1
          fi

      - name: Build and check distributions
        run: |
          python -m pip install 'build==1.6.0' 'twine==7.0.0'
          python -m build --outdir dist
          python -m twine check --strict dist/*

      - name: Verify installed wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          for distribution in "$PWD"/dist/*.whl "$PWD"/dist/*.tar.gz; do
            venv="$(mktemp -d "$smoke_dir/venv.XXXXXX")"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --no-deps "$distribution"
            (
              cd "$smoke_dir"
              "$venv/bin/python" -m pip check
              "$venv/bin/python" -c 'import loongforge'
              "$venv/bin/LoongForge" --help
            )
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: inputs.destination == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: inputs.destination == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
