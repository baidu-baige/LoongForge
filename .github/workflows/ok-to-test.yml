name: GPU CI Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: write

concurrency:
  group: gpu-dispatch-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ok-to-test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: request
        name: Parse command
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          payload="$(printf '%s' "$COMMENT" | python .github/scripts/ci_command.py)"
          echo "payload=$payload" >> "$GITHUB_OUTPUT"
      - id: context
        name: Resolve pull request head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REQUEST: ${{ steps.request.outputs.payload }}
          ENABLE_MCORE: ${{ vars.CI_ENABLE_MCORE }}
        with:
          script: |
            const request = JSON.parse(process.env.REQUEST);
            const association = context.payload.comment.author_association;
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association)) {
              core.setFailed('only repository collaborators may trigger GPU CI');
              return;
            }

            if (request.suite === 'mcore' && process.env.ENABLE_MCORE !== 'true') {
              core.setFailed('the requested GPU suite is disabled by repository configuration');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const headRepo = pull.head.repo
              || { full_name: `${context.repo.owner}/${context.repo.repo}` };
            core.setOutput('pr_number', String(pull.number));
            core.setOutput('head_repo', headRepo.full_name);
            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('base_ref', pull.base.ref);
            core.setOutput('suite', request.suite);
            const models = request.models.length
              ? request.models
              : [request.suite === 'torch' ? 'pi05_ddp' : 'deepseek_v2_lite'];
            core.setOutput('models', models.join(','));
            core.setOutput('build_image', String(request.build_image));
      - name: Validate models against suite manifest
        uses: ./.github/actions/validate-models
        with:
          suite: ${{ steps.context.outputs.suite }}
          models: ${{ steps.context.outputs.models }}
          repository: ${{ steps.context.outputs.head_repo }}
          ref: ${{ steps.context.outputs.head_sha }}
          baseline_alias: ${{ steps.context.outputs.suite == 'torch' && 'p' || 'a' }}
      - name: Dispatch immutable revision
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_REPO: ${{ steps.context.outputs.head_repo }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          SUITE: ${{ steps.context.outputs.suite }}
          MODELS: ${{ steps.context.outputs.models }}
          BUILD_IMAGE: ${{ steps.context.outputs.build_image }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
        with:
          script: |
            const { findActionRequiredCheck } = require('./.github/scripts/gpu_checks');
            const [headOwner, headRepo] = process.env.HEAD_REPO.split('/');
            const { data: headCommit } = await github.rest.repos.getCommit({
              owner: headOwner,
              repo: headRepo,
              ref: process.env.HEAD_SHA,
            });
            const externalId = `loongforge-gpu:${process.env.PR_NUMBER}:${process.env.HEAD_SHA}`;
            const existingRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.HEAD_SHA,
              check_name: 'gpu-regression',
              per_page: 100,
            });
            const existing = findActionRequiredCheck(existingRuns, process.env.HEAD_SHA);
            const queuedOutput = {
              title: 'GPU validation queued',
              summary: `Waiting for suite: ${process.env.SUITE}`,
            };
            let check;
            if (existing) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: existing.id,
                status: 'in_progress',
                started_at: new Date().toISOString(),
                details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${process.env.PR_NUMBER}`,
                output: queuedOutput,
              });
              check = existing;
            } else {
              const { data: created } = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'gpu-regression',
                head_sha: process.env.HEAD_SHA,
                external_id: externalId,
                status: 'in_progress',
                started_at: new Date().toISOString(),
                details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${process.env.PR_NUMBER}`,
                output: queuedOutput,
              });
              check = created;
            }

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'gpu-regression.yml',
                ref: process.env.BASE_REF,
                inputs: {
                  pr_number: process.env.PR_NUMBER,
                  head_repo: process.env.HEAD_REPO,
                  head_sha: process.env.HEAD_SHA,
                  tree_sha: headCommit.commit.tree.sha,
                  suite: process.env.SUITE,
                  models: process.env.MODELS,
                  build_image: process.env.BUILD_IMAGE,
                  gate_check_id: String(check.id),
                },
              });
            } catch (error) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: 'failure',
                completed_at: new Date().toISOString(),
                output: { title: 'GPU dispatch failed', summary: 'The regression workflow could not be dispatched.' },
              });
              throw error;
            }
