name: Internal Image Update

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request number
        required: true
        type: string
      target:
        description: Logical image target
        required: true
        default: all
        type: choice
        options: [a, h, p, all]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: internal-image-update
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      tree_sha: ${{ steps.pr.outputs.tree_sha }}
      target: ${{ steps.pr.outputs.target }}
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - id: pr
        uses: actions/github-script@v7
        env:
          REQUESTED_PR: ${{ inputs.pr_number || github.event.pull_request.number }}
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.REQUESTED_PR),
            });
            if (!pull.merged || !pull.merge_commit_sha) {
              core.setFailed('image promotion requires a merged pull request');
              return;
            }
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pull.head.sha,
              per_page: 100,
            });
            const expectedGate = `loongforge-gpu:${pull.number}:${pull.head.sha}`;
            const gates = checks.check_runs.filter((run) => run.external_id === expectedGate);
            gates.sort((a, b) => Date.parse(b.started_at) - Date.parse(a.started_at));
            if (!gates.length && process.env.EVENT_NAME === 'pull_request') {
              core.info('no GPU gate for this merged PR; skipping image promotion');
              core.setOutput('skip', 'true');
              return;
            }
            if (!gates.length || gates[0].conclusion !== 'success') {
              core.setFailed('the latest ci-gate check must pass before image promotion');
              return;
            }
            core.setOutput('pr_number', String(pull.number));
            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('merge_sha', pull.merge_commit_sha);
            const headRepo = pull.head.repo || { owner: { login: context.repo.owner }, name: context.repo.repo };
            const { data: headCommit } = await github.rest.repos.getCommit({
              owner: headRepo.owner.login,
              repo: headRepo.name,
              ref: pull.head.sha,
            });
            core.setOutput('tree_sha', headCommit.commit.tree.sha);
            core.setOutput('target', process.env.REQUESTED_TARGET);
            core.setOutput('skip', 'false');

  promote:
    needs: resolve
    if: ${{ needs.resolve.outputs.skip != 'true' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_IMAGE) }}
    environment: internal-registry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.merge_sha }}
          persist-credentials: false
      - name: Validate and promote candidate image
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
          TREE_SHA: ${{ needs.resolve.outputs.tree_sha }}
          INTERNAL_REGISTRY_USERNAME: ${{ secrets.INTERNAL_REGISTRY_USERNAME }}
          INTERNAL_REGISTRY_PASSWORD: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}
        run: .github/scripts/promote_candidate_image.sh "${{ needs.resolve.outputs.target }}"
