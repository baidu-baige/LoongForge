name: Doc Links

on:
  workflow_call:

permissions:
  contents: read

jobs:
  doc-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify example and config references in docs
        shell: bash
        run: |
          set -euo pipefail
          # Existing baseline documentation is owned by the docs team. PR CI
          # checks changed Markdown so it blocks newly introduced broken paths
          # without importing unrelated baseline failures into this PR.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .github/scripts/check_doc_links.py --changed-since "${{ github.event.pull_request.base.sha }}"
          else
            python3 .github/scripts/check_doc_links.py --changed-since HEAD
          fi
