name: 'Validate regression models'
description: 'Validate requested model names against the suite manifest at a given ref'
inputs:
  suite:
    description: 'Test suite (mcore or torch)'
    required: true
  models:
    description: 'Comma-separated model names'
    required: true
  repository:
    description: 'Full name of the repository holding the manifest (owner/repo)'
    required: true
  ref:
    description: 'Ref (commit SHA) to read the manifest from'
    required: true
  baseline_alias:
    description: 'Public baseline alias (a or p)'
    required: true

runs:
  using: composite
  steps:
    - name: Validate models against suite manifest
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        SUITE: ${{ inputs.suite }}
        MODELS: ${{ inputs.models }}
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        SOURCE_REF: ${{ inputs.ref }}
        BASELINE_ALIAS: ${{ inputs.baseline_alias }}
      with:
        script: |
          const suite = process.env.SUITE;
          const { filterModelsWithBaselines, missingModels } = require('./.github/scripts/ci_model_validation');
          let models = process.env.MODELS.split(',').map((m) => m.trim()).filter(Boolean);
          if (!models.length) {
            models = [suite === 'torch' ? 'pi05_ddp' : 'deepseek_v2_lite'];
          }
          if (models.some((model) => !/^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(model))) {
            core.setFailed('invalid model list');
            return;
          }
          const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
          const baselineDir = process.env.BASELINE_ALIAS;
          if (!/^[ap]$/.test(baselineDir)) {
            core.setFailed('invalid baseline alias');
            return;
          }
          // Validate models against the suite manifest at the requested ref so
          // typos fail before runner time is spent on image pulls, container
          // creation, and a slow regression start.
          let knownModels;
          if (suite === 'torch') {
            const { data: manifest } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'tests/torch/config/scripts.yaml',
              ref: process.env.SOURCE_REF,
            });
            const yaml = Buffer.from(
              manifest.content,
              manifest.encoding || 'base64',
            ).toString('utf8');
            knownModels = new Set(
              [...yaml.matchAll(/^([A-Za-z0-9][A-Za-z0-9_.-]*):(?=\s*\S)/gm)].map((m) => m[1]),
            );
            let baselines = [];
            try {
              const response = await github.rest.repos.getContent({
                owner, repo, path: `tests/torch/baseline/${baselineDir}`, ref: process.env.SOURCE_REF,
              });
              baselines = response.data;
            } catch (error) {
              // Missing baseline directories are represented as missing models.
            }
            const baselineModels = new Set(baselines.filter((e) => e.type === 'file' && e.name.endsWith('.json')).map((e) => e.name.replace(/\.json$/, '')));
            knownModels = new Set(filterModelsWithBaselines(models, knownModels, baselineModels));
          } else {
            // The mcore regression entry passes only --models, so it can
            // resolve flat names from tests/mcore/configs/ exclusively.
            if (models.some((model) => model.includes('/'))) {
              core.setFailed(
                'mcore model names must not contain "/"; the regression entry searches tests/mcore/configs/ only',
              );
              return;
            }
            const { data: entries } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'tests/mcore/configs',
              ref: process.env.SOURCE_REF,
            });
            knownModels = new Set(
              entries
                .filter((entry) => entry.type === 'file' && entry.name.endsWith('.yaml'))
                .map((entry) => entry.name.replace(/\.yaml$/, '')),
            );
            const baselineModels = new Set();
            for (const kind of ['default', 'optional']) {
              try {
                const { data: baselines } = await github.rest.repos.getContent({
                  owner, repo,
                  path: `tests/mcore/baseline/${kind}/${baselineDir}`,
                  ref: process.env.SOURCE_REF,
                });
                for (const entry of baselines) {
                  if (entry.type === 'file' && entry.name.endsWith('.json')) {
                    baselineModels.add(entry.name.replace(/\.json$/, ''));
                  }
                }
              } catch (error) {
                // A missing optional baseline directory is valid; individual
                // missing model files are reported below by name.
              }
            }
            knownModels = new Set(filterModelsWithBaselines(models, knownModels, baselineModels));
          }
          const unknownModels = missingModels(models, knownModels);
          if (unknownModels.length) {
            core.setFailed(
              `unknown ${suite} model(s): ${unknownModels.join(', ')}. ` +
                `Choose from: ${[...knownModels].join(', ')}`,
            );
          }
