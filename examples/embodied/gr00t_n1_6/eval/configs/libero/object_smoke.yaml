# GR00T-N1.6 × LIBERO object task-success (public template).
#
# Fill in the /path/to/... placeholders (see object_smoke_internal.yaml for the
# machine-local layout). Bounded by default to 1 task / 1 episode.
#
# Required assets:
#   - model.base_model_path / model.model_name : local GR00T-N1.6 Eagle3 processor
#     dir (Eagle3VL config.json + tokenizer; also serves as the backbone config)
#   - server.ckpt_path : GR00T-N1.6 LIBERO fine-tuned checkpoint dir
#   - server.dataset_statistics_path : libero_panda state/action stats JSON
#     (ships in the checkpoint's experiment_cfg/)
#
# Full-suite knobs: max_tasks: 0 (all 10 tasks), episodes_per_task: 20.

benchmark:
  name: libero
  suite: libero_object
  max_tasks: 1
  episodes_per_task: 1
  max_steps: 280
  num_steps_wait: 10
  continuous_gripper: false
  control_mode: delta        # GR00T outputs delta EE (pos + axis-angle) + gripper

model:
  backend: loongforge
  model_type: Gr00tN1d6
  base_model_path: /path/to/eagle3-processor-groot-n1d6
  model_name: /path/to/eagle3-processor-groot-n1d6
  vlm_tokenizer_path: /path/to/eagle3-processor-groot-n1d6
  state_encoding: libero_ee_euler
  action_encoding: axis_angle
  use_flash_attention: true   # set false if flash_attn is not installed (uses sdpa)

server:
  host: 127.0.0.1
  port: 13191
  health_port: 13192
  python: /path/to/envs/loongforge/bin/python
  log: /path/to/reports/groot_n1_6/libero/object_smoke/policy_server.log
  start_timeout_sec: 2400
  random_init: false
  ckpt_path: /path/to/GR00T-N1.6-LIBERO
  dataset_statistics_path: /path/to/GR00T-N1.6-LIBERO/experiment_cfg/dataset_statistics.json
  embodiment_tag: libero_panda
  use_bf16: true
  loongforge_root: /path/to/LoongForge-VLA

env:
  eval_root: /path/to/LoongForge-VLA/loongforge/embodied/eval
  libero_config_path: /path/to/libero_config
  mujoco_gl: osmesa
  pyopengl_platform: osmesa
  ld_library_path: /path/to/nvidia_lib

run:
  output_dir: /path/to/reports/groot_n1_6/libero/object_smoke
  seed: 7
  save_trace: false
  save_replay: false
  timestamped_output: false

timeouts:
  policy_call_ms: 600000
  per_step_sec: 600
  per_episode_sec: 3600
