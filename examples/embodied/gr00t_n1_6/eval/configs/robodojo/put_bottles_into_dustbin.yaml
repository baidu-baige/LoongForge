# GR00T-N1.6 on RoboDojo (Isaac Sim 5.1, dual-arm ARX X5) -- one task, one seed tag.
# put_bottles_into_dustbin, native episode count. Change benchmark.task_name for other tasks;
# set benchmark.eval_num to cap the episode count.
#
# RoboDojo releases no GR00T-N1.6 checkpoint and has no N1.6 plugin, so this config follows the
# official GR00T_N17 RoboDojo conventions: embodiment robodojo_arx_x5 (NEW_EMBODIMENT projector
# and statistics), the three env-native views [head, left wrist, right wrist] (the model's eval
# image transform letterboxes them), the raw 14-D joint state, 16 relative joint actions made
# absolute against the current state inside the model, and the whole 16-step chunk executed as
# joint control. Point ckpt_path at an N1.6 checkpoint fine-tuned on RoboDojo data and
# dataset_statistics_path at its statistics.json (new_embodiment entry with state / action /
# relative_action). The pretrained GR00T-N1.6-3B has no trained new_embodiment projector, so it
# only exercises the wiring.
# Fill /path/to/... below. Do not commit machine-specific absolute paths.

benchmark:
  name: robodojo
  task_name: put_bottles_into_dustbin
  seed: 0              # result tag (RoboDojo uses it for the training-seed column)
  env_cfg_type: arx_x5
  action_bridge: gr00t_n16_joint14
  first_chunk_len: 16  # = len(action delta_indices); every chunk runs to the end
  chunk_len: 16

model:
  backend: loongforge
  model_type: Gr00tN1d6
  base_model_path: /path/to/eagle3-processor-groot-n1d6
  model_name: /path/to/eagle3-processor-groot-n1d6
  vlm_tokenizer_path: /path/to/eagle3-processor-groot-n1d6
  state_encoding: robodojo_joint14
  use_flash_attention: true

server:
  host: 127.0.0.1
  port: 62151
  health_port: 62152
  python: /path/to/loongforge/bin/python
  start_timeout_sec: 2400
  random_init: false
  ckpt_path: /path/to/GR00T-N1.6-RoboDojo
  dataset_statistics_path: /path/to/GR00T-N1.6-RoboDojo/statistics.json
  embodiment_tag: robodojo_arx_x5
  chunk_execute_steps: 0   # no truncation: execute all 16 actions
  use_bf16: true

env:
  eval_root: /path/to/LoongForge/loongforge/embodied/eval
  loongforge_root: /path/to/LoongForge
  robodojo_root: /path/to/RoboDojo          # with Assets/ downloaded (scripts/init_assets.sh)
  robodojo_python: /path/to/robodojo/bin/python   # Isaac Sim 5.1 + IsaacLab + curobo env
  sim_env: {}          # extra env vars for the sim client (e.g. VK_ICD_FILENAMES)

run:
  output_dir: /path/to/reports/gr00t_n1_6/robodojo/put_bottles_into_dustbin_seed0
  cuda_visible_devices: "0"   # GPU of the sim client; the policy server inherits CUDA_VISIBLE_DEVICES
  timestamped_output: false

timeouts:
  per_task_sec: 0             # whole official client run for this task; 0 = no limit
  policy_call_sec: 900
