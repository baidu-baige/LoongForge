# LingBot-VLA v2 RoboTwin 2.0 eval config (smoke: 1 task, 3 episodes).
# Weight: official robbyant/lingbot-vla-v2-6b-robotwin (checkpoints/global_step_50000/hf_ckpt,
# lingbotvla_cli.yaml three levels up). The LoongForge-trained checkpoints use the same layout.
#
# Protocol of the community launcher experiment/robotwin/start_robotwin_infer_and_eval.sh
# (lingbot-vla-v2, RoboTwin 13c3c47): seed 0 -> start seed 100000, 100 expert-valid episodes per task,
# instruction_type unseen (policy/ACT/deploy_policy.yml), each task's official step limit from
# task_config/_eval_step_limit.yml (the runner writes benchmark.max_steps over it, so pass the official
# value), FP32 inference with torch.compile, 50-step chunks executed open-loop (the model returns the
# whole chunk; server.chunk_execute_steps stays unset). Published: Clean 93.52% / Randomized 92.80%.
#
# Notes:
#   - model.qwen3vl_path: Qwen3-VL-4B-Instruct dir (config, tokenizer, processor; no weights read).
#   - The server python needs the upstream lingbotvla package (pinned commit of the training example)
#     and flash-attn; transformers 4.57.3 (community pin) or 5.x (LoongForge shims) both load it.
#   - run.worker_local_files must stay true: otherwise the runner edits script/eval_policy.py and
#     task_config/_eval_step_limit.yml inside the RoboTwin checkout.
#   - demo_randomized additionally needs the RoboTwin background_texture assets.
#   - model.noise_seed / dump_dir are parity-check knobs; leave them off for benchmark runs.

benchmark:
  name: robotwin
  task_name: adjust_bottle
  task_config: demo_clean  # demo_randomized for the randomized benchmark
  start_seed: 100000
  episodes_per_task: 3
  max_steps: 400
  disable_expert_check: false
  instruction_type: unseen
  action_bridge: lingbot_vla_v2_joint14
  # Client-owned 50-step chunk: one request and one camera render per chunk, which is the
  # community client's loop (the model returns the whole chunk; chunk_execute_steps stays unset).
  return_action_chunk: true
  skip_intra_chunk_obs: true

model:
  backend: loongforge
  model_type: lingbot_vla_v2
  name: lingbot-vla-v2-robotwin
  qwen3vl_path: /path/to/Qwen3-VL-4B-Instruct
  training_config_path: ""  # empty -> <ckpt_path>/../../../lingbotvla_cli.yaml
  robo_name: robotwin
  use_length: 50
  use_compile: true
  attention_implementation: eager
  seed: 42
  noise_seed: null

server:
  host: 127.0.0.1
  port: 62900
  health_port: 62901
  python: /path/to/lingbotvla_env/bin/python
  log: /path/to/reports/lingbot_vla_v2/robotwin/adjust_bottle_smoke/policy_server.log
  start_timeout_sec: 1800
  random_init: false
  ckpt_path: /path/to/lingbot-vla-v2-6b-robotwin/checkpoints/global_step_50000/hf_ckpt
  use_bf16: false  # release protocol is FP32; bf16 changes success rates

env:
  eval_root: /path/to/LoongForge/loongforge/embodied/eval
  loongforge_root: /path/to/LoongForge
  robotwin_root: /path/to/RoboTwin
  robotwin_python: /path/to/robotwin_env/bin/python

run:
  output_dir: /path/to/reports/lingbot_vla_v2/robotwin/adjust_bottle_smoke
  seed: 0
  ckpt_setting: loongforge_lingbot_vla_v2_robotwin
  worker_local_files: true
  disable_eval_video_log: true
  keep_config: true
  timestamped_output: false

timeouts:
  # Budget for one task's whole official eval subprocess (all episodes).
  per_episode_sec: 21600
