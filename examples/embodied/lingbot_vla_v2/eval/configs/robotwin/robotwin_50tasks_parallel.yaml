# LingBot-VLA v2 RoboTwin 2.0 parallel-evaluation template (all 50 tasks; one policy server per GPU,
# N sim workers per GPU, global queue). See docs/source/embodied_tutorial/eval_docs/parallel_eval.md.
# Fill /path/to/... and run with examples/embodied/lingbot_vla_v2/eval/run_robotwin_eval_parallel.sh.
#
# Protocol is the community baseline, same as robotwin_50tasks.yaml: start seed 100000, 100 expert-valid
# episodes per task, instruction_type unseen, official per-task step limits, FP32 + torch.compile,
# 50-step chunks. Published: Clean 93.52% / Randomized 92.80%.
#
# return_action_chunk + skip_intra_chunk_obs reproduce the community client's loop: the client owns the
# 50-step chunk, so one request and one camera render per chunk instead of per env step. Leave
# chunk_execute_steps unset so the whole returned chunk is executed before replanning.
#
# Offline expert check (skips the per-episode expert rollout and the second setup_demo):
#   1) scan once per task_config into its own directory, ONE shard per task:
#        benchmark.offline_expert_check_scan: /path/to/expert_cache/demo_clean
#        benchmark.offline_expert_check_scan_shards: 1
#      (k>1 shards collect ceil(E/k) seeds per residue class; the merged set need not be the first E
#      seeds the online check would admit)
#   2) set benchmark.offline_expert_check to that directory here.
#
# Measured on 8xA800-80GB with 8 CPU cores, official SFT weights (2026-11-24): N=4, 50 x 100 episodes,
#   demo_clean      93.50% (published 93.52%), 88.9 min end to end, validation.ok
#   demo_randomized 92.80% (published 92.80%), 104.3 min end to end, validation.ok
# N is bounded by CPU on a small host (the N sweep plateaued at N~5); sampled peak VRAM 55 GB (clean) / 61 GB (randomized) per card at N=4.
# On a host with many more cores raise N and re-measure with orchestrator/calibration/calibrate.py.

benchmark:
  name: robotwin
  tasks: all
  task_name: adjust_bottle
  task_config: demo_clean  # demo_randomized for the randomized benchmark (scan its own cache)
  start_seed: 100000
  episodes_per_task: 100
  use_official_step_limits: true
  disable_expert_check: false
  instruction_type: unseen
  action_bridge: lingbot_vla_v2_joint14
  plan_order: lpt_long
  episodes_per_chunk: 25
  long_task_steps: 1200
  long_task_episodes_per_chunk: 10
  sim_cpu_threads: 1
  return_action_chunk: true
  skip_intra_chunk_obs: true
  # offline_expert_check: /path/to/expert_cache/demo_clean

model:
  backend: loongforge
  model_type: lingbot_vla_v2
  name: lingbot-vla-v2-robotwin
  qwen3vl_path: /path/to/Qwen3-VL-4B-Instruct
  training_config_path: ""  # empty -> <ckpt_path>/../../../lingbotvla_cli.yaml
  robo_name: robotwin
  use_length: 50
  use_compile: true
  attention_implementation: eager
  seed: 42

server:
  host: 127.0.0.1
  port: 62900
  health_port: 62901
  python: /path/to/lingbotvla_env/bin/python
  log: /path/to/reports/lingbot_vla_v2/robotwin/parallel/policy_server.log
  start_timeout_sec: 1800
  random_init: false
  ckpt_path: /path/to/lingbot-vla-v2-6b-robotwin/checkpoints/global_step_50000/hf_ckpt
  use_bf16: false  # release protocol is FP32

servers:
  - gpus: [0, 1, 2, 3, 4, 5, 6, 7]

pools:
  gpu_sim:
    n_sims_per_server: 4
    placement: co_locate

# Fail-fast budget: N x per-sim + model must fit in one card (measured peaks).
resources:
  gpu_sim:
    vram_total_mb: 81920
    vram_per_sim_mb: 7000
    vram_model_mb: 27000

env:
  eval_root: /path/to/LoongForge/loongforge/embodied/eval
  loongforge_root: /path/to/LoongForge
  robotwin_root: /path/to/RoboTwin
  robotwin_python: /path/to/robotwin_env/bin/python

run:
  output_dir: /path/to/reports/lingbot_vla_v2/robotwin/parallel
  seed: 0
  ckpt_setting: loongforge_lingbot_vla_v2_robotwin_parallel
  worker_local_files: true
  disable_eval_video_log: true
  keep_config: true
  timestamped_output: false
  unit_timeout_sec: 18000

timeouts:
  # robotwin runner: budget of one unit's whole official eval subprocess
  per_episode_sec: 18000
