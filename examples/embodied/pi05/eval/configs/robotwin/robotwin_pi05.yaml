# pi0.5 RoboTwin-2.0 evaluation template.
#
# NOTE on timeouts.per_episode_sec: in the RoboTwin runner this value is passed as
# the subprocess timeout for the entire eval_policy.py invocation of a task (all
# episodes), not a single episode. Keep it >= 72000 for 100-episode evaluations.
# Fill /path/to/... below and run with examples/embodied/pi05/eval/run_robotwin_eval.sh.

benchmark:
  name: robotwin
  task_name: adjust_bottle
  task_config: demo_clean
  start_seed: 100000
  episodes_per_task: 10
  max_steps: 300
  disable_expert_check: false
  action_bridge: pi05_aloha_14d

model:
  backend: loongforge
  model_type: pi05
  name: loongforge-pi05-robotwin
  action_dim: 14
  state_dim: 14
  action_horizon: 30
  max_action_dim: 32
  max_state_dim: 32
  compile_model: false
  action_mode: abs
  eval_image_normalize_mode: siglip
  eval_normalization_mode: q99

server:
  host: 127.0.0.1
  port: 12500
  health_port: 12501
  python: /path/to/loongforge/bin/python
  log: /path/to/LoongForge/outputs/eval/robotwin_pi05/policy_server.log
  start_timeout_sec: 900
  random_init: false
  ckpt_path: /path/to/pi05_robotwin_ckpt
  dataset_statistics_path: /path/to/pi05_robotwin_ckpt/dataset_statistics.json
  loongforge_root: /path/to/LoongForge
  tokenizer_path: /path/to/paligemma-3b-pt-224
  use_bf16: false

env:
  eval_root: /path/to/LoongForge/loongforge/embodied/eval
  robotwin_root: /path/to/RoboTwin
  robotwin_python: /path/to/robotwin/bin/python

run:
  output_dir: /path/to/LoongForge/outputs/eval/robotwin_pi05
  seed: 0
  ckpt_setting: loongforge_pi05_robotwin
  worker_local_files: true
  disable_eval_video_log: true
  keep_config: true
  timestamped_output: false

timeouts:
  policy_call_ms: 600000
  per_step_sec: 600
  # Total wall-clock timeout (seconds) for the whole eval_policy.py subprocess of a task.
  per_episode_sec: 72000
