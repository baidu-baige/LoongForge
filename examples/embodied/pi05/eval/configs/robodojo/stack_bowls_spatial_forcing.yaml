# Spatial_Forcing (pi0.5) on RoboDojo (Isaac Sim 5.1, dual-arm ARX X5) -- one task, one seed tag.
# stack_bowls, native episode count. Change benchmark.task_name for other tasks; set
# benchmark.eval_num to cap the episode count.
#
# Checkpoint: the RoboDojo-released Spatial_Forcing SFT (HF dataset RoboDojo-Benchmark/RoboDojo,
# ckpt/RoboDojo/Spatial_Forcing/RoboDojo-sim-arx_x5-joint-<seed>, the step-59999 dir itself) is an
# openpi JAX (orbax) checkpoint of plain pi0.5 weights plus an align_projector that is only used by the
# training-time VGGT alignment loss. Convert params/ with openpi's examples/convert_jax_model_to_pytorch.py
# (any pi05 Pi0Config, e.g. pi05_base_aloha_full_sim_arx-x5_seed_0; the projector is not converted) into
# <ckpt_path>/model.safetensors, and write <ckpt_path>/dataset_statistics.json from
# assets/RoboDojo_lerobot_v21_video/norm_stats.json (state -> observation.state, actions -> action,
# q99 += 1e-6).
#
# bridge=pi05_sf_joint14 mirrors the official RoboDojo Spatial_Forcing adapter (open_sf config
# pi05sf_jax_robodojo_v21_offcache: LeRobotAlohaDataConfig, adapt_to_pi=False,
# use_delta_joint_actions=False): the pi05_joint14 inputs (three cameras resized the openpi way to
# 224, raw 14-D joint state discretized into the prompt), the 14 absolute joints executed as
# predicted, whole 50-step chunk.
# Fill /path/to/... below. Do not commit machine-specific absolute paths.

benchmark:
  name: robodojo
  task_name: stack_bowls
  seed: 0              # result tag (RoboDojo uses it for the training-seed column)
  env_cfg_type: arx_x5
  action_bridge: pi05_sf_joint14
  first_chunk_len: 50  # = model.action_horizon; every chunk runs to the end
  chunk_len: 50

model:
  backend: loongforge
  model_type: pi05
  name: loongforge-pi05-sf-robodojo
  action_dim: 14
  state_dim: 14
  action_horizon: 50
  max_action_dim: 32
  max_state_dim: 32
  compile_model: false

server:
  host: 127.0.0.1
  port: 62121
  health_port: 62122
  python: /path/to/loongforge/bin/python
  start_timeout_sec: 1800
  random_init: false
  ckpt_path: /path/to/spatial_forcing_robodojo_seed0_pytorch
  dataset_statistics_path: /path/to/spatial_forcing_robodojo_seed0_pytorch/dataset_statistics.json
  tokenizer_path: /path/to/paligemma-3b-pt-224
  use_bf16: false                    # the LF pi05 eval path is fp32 (bf16 cast breaks the time MLP); openpi runs bf16 params
  chunk_execute_steps: 0             # no truncation: the official deploy executes all 50 actions
  eval_image_normalize_mode: siglip  # [0, 1] -> [-1, 1], as openpi feeds the model
  eval_normalization_mode: q99

env:
  eval_root: /path/to/LoongForge/loongforge/embodied/eval
  loongforge_root: /path/to/LoongForge
  robodojo_root: /path/to/RoboDojo          # with Assets/ downloaded (scripts/init_assets.sh)
  robodojo_python: /path/to/robodojo/bin/python   # Isaac Sim 5.1 + IsaacLab + curobo env
  sim_env: {}          # extra env vars for the sim client (e.g. VK_ICD_FILENAMES)

run:
  output_dir: /path/to/reports/pi05_sf/robodojo/stack_bowls_seed0
  cuda_visible_devices: "0"   # GPU of the sim client; the policy server inherits CUDA_VISIBLE_DEVICES
  timestamped_output: false

timeouts:
  per_task_sec: 0             # whole official client run for this task; 0 = no limit
  policy_call_sec: 900
