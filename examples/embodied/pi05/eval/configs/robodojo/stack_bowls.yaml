# Pi0.5 on RoboDojo (Isaac Sim 5.1, dual-arm ARX X5) -- one task, one seed tag.
# stack_bowls, native episode count. Change benchmark.task_name for other tasks; set
# benchmark.eval_num to cap the episode count.
#
# Checkpoint: the RoboDojo-released Pi_05 SFT (HF dataset RoboDojo-Benchmark/RoboDojo,
# ckpt/RoboDojo/Pi_05/RoboDojo-sim-arx_x5-joint-<seed>/59999) is an openpi JAX (orbax)
# checkpoint. Convert params/ with openpi's examples/convert_jax_model_to_pytorch.py
# (config pi05_base_aloha_full_sim_arx-x5_seed_<seed>) into <ckpt_path>/model.safetensors, and
# write <ckpt_path>/dataset_statistics.json from assets/arx_x5_sim/norm_stats.json
# (state -> observation.state, actions -> action, q99 += 1e-6 to match openpi's quantile
# normalization exactly).
#
# bridge=pi05_joint14 mirrors the official RoboDojo Pi_05 adapter (openpi LeRobotAlohaDataConfig,
# adapt_to_pi=False): three cameras (head, left wrist, right wrist) resized with padding to 224,
# the raw 14-D joint state (q99-normalized and discretized into the prompt), delta arm joints
# made absolute against the chunk's state, and the whole 50-step chunk executed as joint control.
# Fill /path/to/... below. Do not commit machine-specific absolute paths.

benchmark:
  name: robodojo
  task_name: stack_bowls
  seed: 0              # result tag (RoboDojo uses it for the training-seed column)
  env_cfg_type: arx_x5
  action_bridge: pi05_joint14
  first_chunk_len: 50  # = model.action_horizon; every chunk runs to the end
  chunk_len: 50

model:
  backend: loongforge
  model_type: pi05
  name: loongforge-pi05-robodojo
  action_dim: 14
  state_dim: 14
  action_horizon: 50
  max_action_dim: 32
  max_state_dim: 32
  compile_model: false

server:
  host: 127.0.0.1
  port: 62121
  health_port: 62122
  python: /path/to/loongforge/bin/python
  start_timeout_sec: 1800
  random_init: false
  ckpt_path: /path/to/pi05_robodojo_seed0_pytorch
  dataset_statistics_path: /path/to/pi05_robodojo_seed0_pytorch/dataset_statistics.json
  tokenizer_path: /path/to/paligemma-3b-pt-224
  use_bf16: true                     # openpi restores the params in bfloat16 for inference
  chunk_execute_steps: 0             # no truncation: the official deploy executes all 50 actions
  eval_image_normalize_mode: siglip  # [0, 1] -> [-1, 1], as openpi feeds the model
  eval_normalization_mode: q99

env:
  eval_root: /path/to/LoongForge/loongforge/embodied/eval
  loongforge_root: /path/to/LoongForge
  robodojo_root: /path/to/RoboDojo          # with Assets/ downloaded (scripts/init_assets.sh)
  robodojo_python: /path/to/robodojo/bin/python   # Isaac Sim 5.1 + IsaacLab + curobo env
  sim_env: {}          # extra env vars for the sim client (e.g. VK_ICD_FILENAMES)

run:
  output_dir: /path/to/reports/pi05/robodojo/stack_bowls_seed0
  cuda_visible_devices: "0"   # GPU of the sim client; the policy server inherits CUDA_VISIBLE_DEVICES
  timestamped_output: false

timeouts:
  per_task_sec: 0             # whole official client run for this task; 0 = no limit
  policy_call_sec: 900
