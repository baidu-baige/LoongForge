# FastWAM RoboTwin task-success eval config (open source).
# Weight: official robotwin_uncond_3cam_384.pt (uncond, 3-cam T-layout 384x320,
# 14D joint actions, z-score stats).
#
# Official RoboTwin protocol (FastWAM deploy_policy + sim_robotwin.yaml):
#   - 3 cams packed to a 384x320 T layout (head (320,256) top, wrists
#     (160,128) side by side below) — model.camera_layout: robotwin_t
#   - proprio = observation.joint_action.vector (14D) pass-through, z-score
#     stats from the checkpoint's *_dataset_stats.json — model.norm_mode: z-score
#   - actions = absolute 14D dual-arm joint qpos, no reorder (the official
#     client feeds the raw chunk to take_action's default action_type='qpos')
#   - replan_steps 24: server.chunk_execute_steps 0 -> robotwin default 24
#   - uncond checkpoint still receives the prompt (DEFAULT_PROMPT template,
#     text_cfg_scale stays 1.0) — load_text_encoder: true
#   - sigma_shift 5.0 (official eval always passes null -> scheduler infer_shift=5.0)
#
# NOTE: RoboTwin is a form-B benchmark (official evaluator reverse-calls the
# bridge). state_encoding / decoder are wired per action_bridge inside
# bridges/robotwin_policy.py:_BRIDGE_WIRING, so no model.state_encoding here.
#
# Optional overrides (edit in place):
#   task_name / task_config / episodes_per_task / max_steps / start_seed
#   server.random_init: true + max_steps: 5 for an RPC wiring check without weights
#
# Full-sweep notes (see examples/embodied/fastwam/eval/ROBOTWIN_EVAL_NOTES.md):
#   - max_steps is task-specific: copy from RoboTwin task_config/_eval_step_limit.yml
#     (400 is NOT universal: blocks_ranking_* 1200, hanging_mug 900, open_laptop
#     700, open_microwave 1500). Truncated horizons undercount success.
#   - task_config: demo_randomized additionally requires the 11 GB
#     assets/background_texture/{seen,unseen} pack (HF TianxingChen/RoboTwin2.0);
#     without it every setup_demo crashes and the official worker silently
#     loops "error occurs !".
#   - model base precision is bf16 (official; `model.dtype` is the real field —
#     the legacy `model_dtype:` key is ignored). Set `dtype: float32` ONLY if
#     your shipped wan/dit.py rope cannot run bf16 (e.g. an unmodified HEAD
#     flash_attn rope); fp32 reproduces the scores but is not the official regime.
#   - official protocol is 100 episodes/task; 10 eps/task is a 1/10 sample
#     (~±15pp stderr at p≈0.9).
#
# RoboTwin release: https://github.com/TianxingChen/RoboTwin (env.robotwin_root)
# RoboTwin python: a conda env with the RoboTwin deps installed.

benchmark:
  name: robotwin
  task_name: adjust_bottle  # optional: other RoboTwin task names
  task_config: demo_clean
  start_seed: 100001
  episodes_per_task: 1
  max_steps: 400  # adjust_bottle only; override per task (see header note)
  disable_expert_check: false
  action_bridge: fastwam_joint14

model:
  backend: loongforge
  model_type: fastwam
  name: fastwam-robotwin-adjust-bottle
  backbone_variant: wan22_5b
  dtype: bfloat16       # official base precision; float32 only for bf16-incompatible rope
  variant: uncond
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null
  redirect_common_files: false
  action_dim: 14
  action_horizon: 32
  proprio_dim: 14
  action_infer_mode: first_frame
  num_inference_steps: 10
  sigma_shift: 5.0
  num_video_frames: 9   # idm mode only; uncond rolls first_frame
  camera_layout: robotwin_t
  norm_mode: z-score
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: /path/to/Wan2.2-TI2V-5B

server:
  host: 127.0.0.1
  port: 12290
  health_port: 12291
  python: /path/to/loongforge_vla/bin/python
  log: /path/to/LoongForge-VLA/loongforge/embodied/eval/reports/fastwam/robotwin/adjust_bottle/policy_server.log
  start_timeout_sec: 1800
  ckpt_path: /path/to/robotwin_uncond_3cam_384.pt
  dataset_statistics_path: /path/to/robotwin_uncond_3cam_384_dataset_stats.json
  loongforge_root: /path/to/LoongForge-VLA
  tokenizer_path: /path/to/Wan2.2-TI2V-5B/google/umt5-xxl
  use_bf16: true
  chunk_execute_steps: 0    # 0 -> official robotwin 24

env:
  eval_root: /path/to/LoongForge-VLA/loongforge/embodied/eval
  robotwin_root: /path/to/RoboTwin
  robotwin_python: /path/to/robotwin/bin/python

run:
  output_dir: /path/to/LoongForge-VLA/loongforge/embodied/eval/reports/fastwam/robotwin/adjust_bottle
  seed: 0
  ckpt_setting: loongforge_fastwam_robotwin
  worker_local_files: true
  disable_eval_video_log: true
  keep_config: true
  timestamped_output: false

timeouts:
  policy_call_ms: 600000
  per_step_sec: 600
  per_episode_sec: 7200  # >=7200 for multi-episode long-horizon batches (3600 truncates them, exit 124)
