  - YogurtInBowlTask
  num_envs: 10
  episodes_per_task: 10
  max_steps: 0
  headless: true
  device: cuda:0
  return_action_chunk: true
model:
  backend: loongforge
  model_type: cosmos3
  name: cosmos3-nano-policy-droid
  qwen3_vl_path: /path/to/ckpt/Cosmos3-Nano-Policy-DROID
  vae_path: /path/to/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
  action_dim: 8
  action_horizon: 32
  state_dim: 8
servers:
  - gpus: [0, 1, 2, 0, 1, 2]

pools:
  gpu_sim:
    n_sims_per_server: 1
    placement: separate
    sim_gpus: [3, 4, 5, 6, 7]
server:
  port: 61300
  health_port: 61301
  start_timeout_sec: 900
  python: /usr/bin/python3
  ckpt_path: /path/to/ckpt/Cosmos3-Nano-Policy-DROID
  loongforge_root: /path/to/LoongForge
  log: /path/to/output/robolab_cosmos3/policy_server.log
timeouts:
  policy_call_ms: 180000
  per_step_sec: 300
  per_episode_sec: 900
run:
  seed: 0
  output_dir: /path/to/output/robolab_cosmos3
  timestamped_output: false
  max_retries: 2
  unit_timeout_sec: 21600
env:
  ld_library_path: <site-packages>/torch/lib:<site-packages>/nvidia/cudnn/lib
  eval_root: /path/to/LoongForge/loongforge/embodied/eval
  loongforge_root: /path/to/LoongForge
