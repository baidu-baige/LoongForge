  - MarkerInMugTask
  - MouseOnKeyboardTask
  - MoveBananaToBagelPlateTask
  - MustardAboveRaisinTask
  - MustardInLeftBinTask
  - MustardInRightBinTask
  - NonHammerToolsInRightBinTask
  - OneBottleInSquarePailTask
  - OneBottleOnShelfTask
  - PhoneOrRemoteInBinTask
