# Cosmos3 x RoboLab full benchmark: 120 tasks x 10 episodes (official protocol).
# 6 policy servers, 2 per GPU on GPU0-2 (16B bf16, ~33 GB each); 6 Isaac Sim workers spread
# over GPU3-7. 
# Replace the /path/to placeholders, then run via run_robolab_eval.sh with CONFIG=<this file>.

benchmark:
  name: robolab
  tasks:
  - AnimalsInBinTask
  - AppleAndYogurtInBowlTask
  - BagelsOnPlateTask
  - BananaInBowlTask
