# Shared by local developer hooks and the license.yml workflow.
# Run locally:  pre-commit run --all-files
# Install hook: pre-commit install

exclude: '^(third_party|patches)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']   # allow Hydra _target_ and custom tags
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        alias: spdx-check-script
        name: SPDX header check (Python/Shell)
        files: '\.(py|sh)$'
        exclude: '^(third_party|patches|tests/datasets|loongforge/embodied/model/lingbot_vla_v2/vendor)/'
        args:
          - --license-filepath=.license-header.txt
          - --use-current-year
          - --detect-license-in-X-top-lines=10
          - --no-extra-eol
          - --comment-style
          - '#'
      - id: insert-license
        alias: spdx-check-cpp
        name: SPDX header check (C/C++/CUDA)
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|cu|cuh)$'
        exclude: '^(third_party|patches|tests/datasets|loongforge/embodied/model/lingbot_vla_v2/vendor)/'
        args:
          - --license-filepath=.license-header.txt
          - --use-current-year
          - --detect-license-in-X-top-lines=10
          - --no-extra-eol
          - --comment-style
          - '//'

  # The Go language hook builds the pinned gitleaks release in pre-commit's
  # isolated environment, so developers do not need a system gitleaks binary.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: sensitive-scan
        name: Sensitive information scan
        entry: python3 ci/sensitive_scan.py --ci-summary --paths
        language: system
        pass_filenames: true
