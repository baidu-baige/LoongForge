# Native regression script manifest: <name>: <script path relative to examples/{vla,world}>
# - The name must match tests/native/baseline/<chip>/<name>.json
# - The name encodes the parallel strategy suffix: ddp / fsdp / ddp_zero1
# - tests/native/cli.py executes the scripts serially in the order of this file

# --- pi05 ---
pi05_ddp:                          vla/pi05/run_pi05_ddp_finetune.sh
pi05_fsdp:                         vla/pi05/run_pi05_fsdp_finetune.sh
pi05_ddp_zero1:                    vla/pi05/run_pi05_ddp_zero1_finetune.sh

