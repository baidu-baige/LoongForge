pfs_path: ${PFS_PATH}
load_hf_ckpt_path_pre: $pfs_path/huggingface.co/
megatron_path: ${MEGATRON_PATH}
LOONGFORGE_PATH: ${LOONGFORGE_PATH}

scripts_root_path: $LOONGFORGE_PATH/tests/llm_vlm
# In the pipeline, the logs path will be replaced by appending a suffix of name + pipeline ID
training_log_path: ${TRAINING_LOG_PATH}
save_mcore_ckpt_path_pre: $training_log_path/megatron_checkpoint
dataset_cache_path: $training_log_path/dataset_cache

convert_checkpoint_path: $LOONGFORGE_PATH/tools/mcore_checkpoint_convert

# Determine the status of each stage of the training task
model_lock_file_path: $save_mcore_ckpt_path_pre/lock_file/$model_name

# Step1: Training output/ckpt path
step1_output_path: $save_mcore_ckpt_path_pre/$model_name

# Number of iterations
train_iters: 20
