<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 138" width="812" height="138"
     role="img" aria-label="LoongForge — Train LLMs, VLMs, diffusion and embodied models, faster.">
  <defs>
    <linearGradient id="lf-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="55%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <!-- Text gradient tuned for dark background: matches site .dark .text-gradient -->
    <linearGradient id="lf-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#A5B4FC"/>
      <stop offset="50%"  stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Icon: squircle + mark -->
  <g transform="translate(18,13) scale(1.75)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#lf-icon)"/>
    <g transform="translate(32,32) scale(1.3) translate(-32.45,-33.85)">
      <path d="M18 40 C 22 30, 28 28, 32 32 C 36 36, 42 34, 46 24"
            stroke="#fff" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <circle cx="46" cy="24" r="3.2" fill="#fff"/>
      <circle cx="18" cy="40" r="2.2" fill="#fff" opacity="0.85"/>
      <path d="M24 46 L40 46" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="148" y="78"
        font-family="'Inter','Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif"
        font-weight="800" font-size="86" letter-spacing="-2.5"
        fill="url(#lf-text)">LoongForge</text>

  <!-- Tagline: one colour for both banners — must stay legible even when a
       renderer picks the light banner but paints it on a dark surface -->
  <text x="151" y="121"
        font-family="'Inter','Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif"
        font-weight="600" font-size="19" letter-spacing="0.3"
        fill="#A855F7">Train LLMs, VLMs, diffusion &amp; embodied models — faster.</text>
</svg>
