<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 160" width="830" height="160"
     role="img" aria-label="LoongForge — Train LLMs, VLMs, diffusion and embodied models, faster.">
  <defs>
    <linearGradient id="lf-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="50%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="lf-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="50%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>

  <!-- Icon: 100×100 squircle + S-curve -->
  <g transform="translate(20,30) scale(1.5625)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#lf-icon)"/>
    <path d="M18 40 C 22 30, 28 28, 32 32 C 36 36, 42 34, 46 24"
          stroke="#fff" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <circle cx="46" cy="24" r="3.2" fill="#fff"/>
    <circle cx="18" cy="40" r="2.2" fill="#fff" opacity="0.85"/>
    <path d="M24 46 L40 46" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <text x="145" y="83"
        font-family="'Inter','Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif"
        font-weight="800" font-size="70" letter-spacing="-2"
        fill="url(#lf-text)">LoongForge</text>

  <!-- Tagline -->
  <text x="148" y="125"
        font-family="'Inter','Helvetica Neue','PingFang SC','Microsoft YaHei',Arial,sans-serif"
        font-weight="500" font-size="22"
        fill="#8B5CF6">Train LLMs, VLMs, diffusion &amp; embodied models — <tspan font-weight="800" fill="#EC4899">faster</tspan>.</text>
</svg>
