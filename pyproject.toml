[project.urls]
Homepage = "https://github.com/baidu-baige/LoongForge"
Repository = "https://github.com/baidu-baige/LoongForge"
Documentation = "https://baidu-baige.github.io/LoongForge/"
Changelog = "CHANGELOG.md"

[project.scripts]
LoongForge = "loongforge.train:main"

[dependency-groups]
test = [
    "pytest",
    "mock",
]
dev = [
    "pre-commit>=3.2",
]
notebook = [
    "jupyterlab",
    "jupyterlab-language-pack-zh-CN",
    "jupytext",
]
internal = [
    # Build toolchain
    "setuptools>=65.5",
    "wheel>=0.42",
    "hatchling>=1.18.0",
    "build>=1.0.3",
    # Test / Dev / Notebook
    {include-group = "test"},
    {include-group = "dev"},
    {include-group = "notebook"},
]

[tool.uv]
no-build-isolation-package = [
    "transformer-engine",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["third_party", "patches"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "S506"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]

[tool.hatch.build]
packages = ["loongforge"]
include = [
    "loongforge/conf/*",
    "loongforge/data/*",
    "loongforge/**/*.yaml",
    "loongforge/**/*.json",
    "loongforge/**/*.jinja",
]

[tool.hatch.build.targets.wheel]
packages = ["loongforge"]
output-dir = "output/dist"

[tool.hatch.build.targets.sdist]
output-dir = "output/dist"
